<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Metro Team · Agent Register</title><link rel="icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050d24;--p:#0b1738;--ln:#1d2f66;--bl:#2a74ff;--go:#ffc61a;--sv:#e8eefb;--mu:#93a3cc;--nv:#1F3864}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;padding-bottom:70px;background:radial-gradient(1000px 520px at 85% -8%,#12306f,transparent 60%),var(--bg);color:var(--sv);font:15px/1.5 Barlow,system-ui,sans-serif;min-height:100vh}
h1,h2,.dn,.big{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:800;margin:0}
input,select,button{font:inherit}:focus-visible{outline:2px solid var(--go);outline-offset:2px}
.in{background:#06102a;border:1px solid var(--ln);color:var(--sv);padding:11px 14px;border-radius:10px;width:100%}
.btn{background:linear-gradient(#ffd84d,#ffb800);color:#0a1228;border:0;font-weight:700;padding:10px 18px;border-radius:10px;cursor:pointer}
.btn.g{background:transparent;color:var(--sv);border:1px solid var(--ln)}.btn.g:hover{border-color:var(--go)}.btn.s{padding:6px 12px;font-size:13px}
#gate{display:grid;place-items:center;min-height:100vh;padding:20px}
.gc{width:min(380px,100%);text-align:center}.gc img{width:min(250px,64vw);filter:drop-shadow(0 0 40px #2a74ffaa)}
.gc .dn{font-size:44px;margin:6px 0 14px;background:linear-gradient(#fff,#a9b7d6);-webkit-background-clip:text;background-clip:text;color:transparent}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#06102a;border:1px solid var(--ln);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{background:none;border:0;color:var(--mu);padding:9px;border-radius:9px;font-weight:700;cursor:pointer}.seg .on{background:var(--bl);color:#fff}
.gc .in{margin-bottom:10px}#err{color:#ff6b78;min-height:24px;margin-top:8px}
header{border-bottom:3px solid var(--bl);background:linear-gradient(#0c1c46,#071029)}
.top{max-width:1500px;margin:auto;padding:12px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.top img{width:72px;height:72px;border-radius:18px;box-shadow:0 0 26px #2a74ff77}
.dn.h{font-size:40px;line-height:.95;background:linear-gradient(#fff,#a9b7d6);-webkit-background-clip:text;background-clip:text;color:transparent}
.acro{display:flex;gap:6px;flex:1;min-width:290px}.acro div{flex:1;border-left:3px solid var(--go);padding:2px 8px;background:#0b1a40;border-radius:0 8px 8px 0}
.acro b{font:italic 800 28px/1 'Barlow Condensed';color:var(--go)}.acro span{display:block;font-size:11px;font-weight:600}
.who{display:flex;gap:10px;align-items:center;margin-left:auto;flex-wrap:wrap}.ss{font-size:13px;color:var(--mu)}.ss.ok{color:#35e58f}.ss.bad{color:#ff6b78}
main{max-width:1500px;margin:auto;padding:18px}
.wel h2{font-size:38px}.wel p{margin:0 0 14px;color:var(--mu)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.k{background:var(--p);border:1px solid var(--ln);border-left:5px solid var(--bl);border-radius:12px;padding:10px 16px}.k:nth-child(2){border-left-color:var(--go)}.k:nth-child(3){border-left-color:#dfe7f7}.k:nth-child(4){border-left-color:#35e58f}
.k small{color:var(--mu);font-weight:600}.big{font-size:38px;line-height:1.1;display:block}
.tbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;color:var(--mu);font-size:13px}.tbar select{background:#06102a;color:var(--sv);border:1px solid var(--ln);padding:6px 8px;border-radius:8px}
.lg i{font-style:normal;font-weight:700;padding:2px 9px;border:1px solid #0003;border-radius:4px;margin-right:2px}.sp{flex:1}
.sheet{background:#fff;color:#111;border:1px solid #9fb0d4;border-radius:8px;overflow:auto;max-height:68vh;font-size:12.5px}
.sheet table{border-collapse:separate;border-spacing:0}.sheet td,.sheet th{border-right:1px solid #cfd6e6;border-bottom:1px solid #cfd6e6;text-align:center;white-space:nowrap;padding:0 5px;height:26px}
.sheet th{background:var(--nv);color:#fff;position:sticky;z-index:2;font-weight:600}.sheet tr.h1 th{top:0;height:22px}.sheet tr.h2 th{top:22px}
.sheet th.so{background:#4a5d85}.sheet th[data-d]{cursor:pointer}.sheet th[data-d]:hover{background:#2a4a8f}
.sheet .nm{position:sticky;left:0;z-index:1;background:#f3f6fc;text-align:left;min-width:150px;font-weight:600;white-space:normal;line-height:1.2}.sheet .nm small{display:block;color:#59678a;font-weight:500}
.sheet th.nm{z-index:3;background:var(--nv)}.sheet .lb{background:#f3f6fc;color:#59678a;font-size:11px;min-width:46px}
.c{min-width:34px;width:34px;font-weight:700;cursor:pointer;user-select:none}.c.ro{cursor:default}
.sP{background:#C6EFCE;color:#006100}.sA{background:#FFC7CE;color:#9C0006}.sL{background:#FFEB9C;color:#9C5700}.sFL{background:#D9C8F0;color:#4B2A80}.sSL{background:#BDE0F2;color:#124A6B}.sOFF{background:#D9D9D9;color:#777;cursor:default}.sN{background:#fff}
.c:hover:not(.sOFF):not(.ro){filter:brightness(.93);outline:1px solid #2a74ff}
.cc{background:#FFF8D6;padding:0!important}.cc.so{background:#D9D9D9}.ci{width:34px;border:0;background:transparent;text-align:center;font:inherit;color:#111;padding:4px 0}.ci:focus{background:#fff;outline:2px solid #2a74ff}
.sm{background:#eef2fa;font-weight:700;min-width:38px}.tt{background:#E2EAF8;font-weight:700;min-width:70px}
.sheet tfoot td{position:sticky;bottom:0;background:#dbe5f7;font-weight:700;z-index:2}.sheet tfoot .nm{z-index:3;background:#dbe5f7}
.pill{padding:1px 8px;border-radius:999px;font-weight:700}.hi{background:#C6EFCE;color:#006100}.mid{background:#FFEB9C;color:#9C5700}.lo{background:#FFC7CE;color:#9C0006}.na{background:#e5e9f3;color:#667}
.sheet td.l{text-align:left}.sheet td.n{text-align:right;font-variant-numeric:tabular-nums;padding:0 10px}.note{padding:20px;color:var(--mu)}
#tabs{position:fixed;bottom:0;left:0;right:0;background:#081230;border-top:2px solid var(--bl);display:flex;gap:3px;overflow:auto;padding:7px 12px 0;z-index:9}
#tabs button{background:#10204f;color:var(--mu);border:1px solid var(--ln);border-bottom:0;border-radius:8px 8px 0 0;padding:8px 16px;font-weight:600;cursor:pointer;white-space:nowrap}#tabs .on{background:#fff;color:var(--nv)}
dialog{background:var(--p);color:var(--sv);border:1px solid var(--go);border-radius:16px;padding:24px;max-width:430px}dialog::backdrop{background:#000b}
@media(max-width:600px){.acro span{font-size:9px}.acro b{font-size:22px}.dn.h{font-size:32px}.sheet .nm{min-width:112px}.wel h2{font-size:30px}}
#pop{position:fixed;z-index:20;background:#fff;border:2px solid var(--bl);border-radius:12px;padding:6px;box-shadow:0 12px 34px #000b;display:grid;gap:4px;min-width:180px}
#pop button{border:0;border-radius:7px;padding:10px 14px;font-weight:700;text-align:left;cursor:pointer;font-size:14px}#pop button:hover{filter:brightness(.92)}#pop .clr{background:#eef1f8;color:#333}
.c:not(.ro).sN:empty::after{content:'▾';color:#aab6d3;font-weight:400}.c:not(.ro){outline-offset:-2px}
</style></head><body>

<section id="gate"><div class="gc"><img src="logo.png" alt="Metro Team crown emblem"><div class="dn">METRO TEAM</div>
<div class="seg"><button data-r="agent" class="on">Agent</button><button data-r="admin">Admin</button></div>
<select class="in" id="who"></select><input class="in" id="pw" type="password" placeholder="Password" autocomplete="off">
<button class="btn" id="go" style="width:100%">Log in</button><div id="err"></div></div></section>

<div id="app" hidden>
<header><div class="top"><img src="logo.png" alt="Metro Team"><div><div class="dn h">METRO TEAM</div><div class="ss" style="color:var(--go);letter-spacing:.14em">ONE TEAM / ONE GOAL</div></div>
<div class="acro"><div><b>M</b><span>Mindset</span></div><div><b>E</b><span>Excellence</span></div><div><b>T</b><span>Teamwork</span></div><div><b>R</b><span>Resilience</span></div><div><b>O</b><span>Ownership</span></div></div>
<div class="who" id="who2"></div></div></header>
<main><div class="wel" id="wel"></div><div id="main"></div></main><nav id="tabs"></nav>
<div id="pop" hidden><button data-v="P" class="sP">P · Present</button><button data-v="A" class="sA">A · Absent</button><button data-v="L" class="sL">L · Leave</button><button data-v="FL" class="sFL">FL · Funeral leave</button><button data-v="SL" class="sSL">SL · Sick leave</button><button data-v="" class="clr">Clear</button></div>
<dialog id="dlg"><h2>Connect GitHub</h2><p style="color:var(--mu)">One-time step on this device so your changes save online. Paste your GitHub access token.</p>
<input class="in" id="tk" type="password" placeholder="github_pat_…"><div id="derr" style="color:#ff6b78;min-height:24px"></div>
<div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn g" id="dc">Later</button><button class="btn" id="ds2">Connect</button></div></dialog>
</div>

<script>
const OWNER='wisekunda21',REPO='teammetro',BR='main',FILE='data.json',DEFPW='m45',ADMIN_HASH='d5ee750b5056a1f99f23dff486ad057446bc35a73f453e6a18334f79ceabca41';
const API=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}`;
const $=s=>document.querySelector(s),CY=['','P','A','L','FL','SL'],ST={P:'Present',A:'Absent',L:'Leave',FL:'Funeral',SL:'Sick'};
const MN=['2026-09','2026-10','2026-11','2026-12'],MT={'2026-09':'September','2026-10':'October','2026-11':'November','2026-12':'December'};
let S={d:null,m:'2026-10',tab:'m',role:'',me:null,sha:null,day:{},ss:['','']},tok='',timer=0,R='agent';
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const fmt=n=>Number(n).toLocaleString('en-US'),pc=p=>p==null?'—':(p*100).toFixed(1)+'%';
const enc=s=>btoa(unescape(encodeURIComponent(s))),dec=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
const dim=m=>new Date(+m.slice(0,4),+m.slice(5),0).getDate(),dow=(m,d)=>(new Date(+m.slice(0,4),+m.slice(5)-1,d).getDay()+6)%7,wk=(m,d)=>Math.floor((d-1+dow(m,1))/7);
const M=m=>S.d.months[m]||(S.d.months[m]={}),att=(m,k,d)=>dow(m,d)==6?'OFF':(M(m).att?.[k]?.[d]||''),cl=(m,k,d)=>M(m).calls?.[k]?.[d]||0;
const cls=p=>p==null?'na':p>=.9?'hi':p>=.75?'mid':'lo',AG=()=>S.d.agents,isA=()=>S.role=='admin';
async function sha(s){return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('')}
const pwh=(k,p)=>sha(k+':'+p.trim().toLowerCase());
function ref(m){if(S.day[m])return S.day[m];const c=M(m).calls||{},t={};let mx=0;for(const k in c)for(const d in c[k])mx=Math.max(mx,t[d]=(t[d]||0)+c[k][d]);let r=1;for(const d in t)if(t[d]>=mx*.5&&+d>r)r=+d;return r}
function stat(m,k,r){const o={day:0,week:0,month:0,P:0,A:0,L:0,FL:0,SL:0,pct:null},mm=M(m);
 if(mm.totals){o.month=mm.totals[k]||0;o.lock=1;return o}
 for(let d=1;d<=dim(m);d++){const c=cl(m,k,d);o.month+=c;if(d==r)o.day=c;if(wk(m,d)==wk(m,r))o.week+=c;const a=att(m,k,d);if(o[a]!==undefined)o[a]++}
 const t=o.P+o.A+o.L+o.FL+o.SL;o.pct=t?o.P/t:null;return o}
const ss=(t,c='')=>{S.ss=[t,c];const e=$('#ss');if(e){e.textContent=t;e.className='ss '+c}};

/* ---------- views ---------- */
function sumT(rows){const T={day:0,week:0,month:0,P:0,n:0};rows.forEach(s=>{T.day+=s.day;T.week+=s.week;T.month+=s.month;T.P+=s.P;T.n+=s.P+s.A+s.L+s.FL+s.SL});T.pct=T.n?T.P/T.n:null;return T}
function kpis(list){const m=S.m,r=ref(m),T=sumT(list.map(a=>stat(m,a.k,r))),lk=!!M(m).totals,f=v=>lk?'—':fmt(v),w=isA()?'Team':'My';
 return `<div class=kp><div class=k><small>${w} calls on ${lk?'the day':r+' '+MT[m].slice(0,3)}</small><span class=big>${f(T.day)}</span></div><div class=k><small>${w} calls this week</small><span class=big>${f(T.week)}</span></div>
 <div class=k><small>${w} calls in ${MT[m]}</small><span class=big>${fmt(T.month)}</span></div><div class=k><small>Attendance</small><span class=big>${pc(T.pct)}</span></div></div>`}
const DY=m=>Array.from({length:dim(m)},(_,i)=>i+1);
const sumA=k=>{const s=stat(S.m,k,1);return ['P','A','L','FL','SL'].map(x=>`<td class=sm>${s[x]}</td>`).join('')+`<td class=sm><span class="pill ${cls(s.pct)}">${pc(s.pct)}</span></td>`};
const sumC=k=>{const m=S.m,n=dim(m),w=Array(wk(m,n)+1).fill(0);let t=0;for(let d=1;d<=n;d++){const c=cl(m,k,d);w[wk(m,d)]+=c;t+=c}return w.map(x=>`<td class=sm>${x?fmt(x):'—'}</td>`).join('')+`<td class=tt>${fmt(t)}</td>`};
function foot(){const m=S.m;return `<tr><td class=nm>Present</td>${DY(m).map(d=>{const a=AG().filter(x=>att(m,x.k,d)=='P').length;return `<td>${a||''}</td>`}).join('')}<td colspan=6></td></tr>`}
function cfoot(){const m=S.m,n=dim(m),W=wk(m,n)+1,wt=Array(W).fill(0);let g=0,h='';for(let d=1;d<=n;d++){const t=AG().reduce((s,a)=>s+cl(m,a.k,d),0);wt[wk(m,d)]+=t;g+=t;h+=`<td>${t||''}</td>`}return `<tr><td class=nm>Team total</td>${h}${wt.map(x=>`<td>${fmt(x)}</td>`).join('')}<td>${fmt(g)}</td></tr>`}
const hd=(m,ed,ex)=>`<thead><tr class=h1><th class=nm rowspan=2>Agent</th>${DY(m).map(d=>`<th class="${dow(m,d)==6?'so':''}">${'MTWTFSS'[dow(m,d)]}</th>`).join('')}${ex.map(x=>`<th rowspan=2>${x}</th>`).join('')}</tr><tr class=h2>${DY(m).map(d=>`<th class="${dow(m,d)==6?'so':''}" ${ed&&dow(m,d)<6?`data-d=${d} title="Mark everyone present"`:''}>${d}</th>`).join('')}</tr></thead>`;
const nmc=a=>`<td class=nm>${a.name}<small>ID ${a.id}</small></td>`;
function attReg(list){const m=S.m,ed=isA();
 return `<div class=sheet><table id=rg>${hd(m,ed,['P','A','L','FL','SL','Att %'])}<tbody>`+list.map(a=>`<tr data-r=${a.k}>${nmc(a)}${DY(m).map(d=>{const v=att(m,a.k,d),e=ed&&v!='OFF';return `<td class="c s${v||'N'}${e?'':' ro'}" ${e?'tabindex=0':''} data-k=${a.k} data-d=${d}>${v}</td>`}).join('')}${sumA(a.k)}</tr>`).join('')+`</tbody>${ed?`<tfoot id=ft>${foot()}</tfoot>`:''}</table></div>`}
function callReg(list){const m=S.m,ed=isA(),W=wk(m,dim(m))+1;
 return `<div class=sheet><table id=cg>${hd(m,false,[...Array.from({length:W},(_,i)=>'Wk '+(i+1)),'Total'])}<tbody>`+list.map(a=>`<tr data-r=${a.k}>${nmc(a)}${DY(m).map(d=>{const v=cl(m,a.k,d);return `<td class="cc${dow(m,d)==6?' so':''}">${ed?`<input class=ci type=number min=0 data-k=${a.k} data-d=${d} value="${v||''}">`:v||''}</td>`}).join('')}${sumC(a.k)}</tr>`).join('')+`</tbody>${ed?`<tfoot id=ft>${cfoot()}</tfoot>`:''}</table></div>`}
function sep(list){const t=M('2026-09').totals;return `<div class=sheet><table><thead><tr><th class=nm>Agent</th><th>User ID</th><th>Total Calls</th></tr></thead><tbody>${list.map(a=>`<tr><td class="nm">${a.name}</td><td>${a.id}</td><td class=n>${fmt(t[a.k]||0)}</td></tr>`).join('')}</tbody><tfoot><tr><td class=nm>TOTAL</td><td></td><td class=n>${fmt(list.reduce((s,a)=>s+(t[a.k]||0),0))}</td></tr></tfoot></table></div>`}
function perf(){const m=S.m,r=ref(m),lk=!!M(m).totals,rows=AG().map(a=>({a,s:stat(m,a.k,r)})).sort((x,y)=>y.s.month-x.s.month);
 return `<div class=sheet><table><thead><tr><th class=nm>Agent</th><th>User ID</th><th>${lk?'Day':'Day '+r}</th><th>Week</th><th>${MT[m]}</th><th>P</th><th>A</th><th>L</th><th>FL</th><th>SL</th><th>Attendance</th></tr></thead><tbody>`+
 rows.map(({a,s},i)=>`<tr><td class=nm>${i+1}. ${a.name}</td><td>${a.id}</td><td class=n>${lk?'—':fmt(s.day)}</td><td class=n>${lk?'—':fmt(s.week)}</td><td class=n><b>${fmt(s.month)}</b></td>${['P','A','L','FL','SL'].map(x=>`<td>${lk?'—':s[x]}</td>`).join('')}<td><span class="pill ${cls(s.pct)}">${pc(s.pct)}</span></td></tr>`).join('')+'</tbody></table></div>'}
function summ(list){const T=a=>MN.map(m=>stat(m,a.k,1).month),tot=MN.map(()=>0);
 return `<div class=sheet><table><thead><tr><th class=nm>Agent</th><th>User ID</th>${MN.map(m=>`<th>${MT[m].slice(0,3)}</th>`).join('')}<th>Total</th></tr></thead><tbody>`+list.map(a=>{const t=T(a);t.forEach((v,i)=>tot[i]+=v);return `<tr><td class=nm>${a.name}</td><td>${a.id}</td>${t.map(v=>`<td class=n>${v?fmt(v):'—'}</td>`).join('')}<td class=n><b>${fmt(t.reduce((s,v)=>s+v,0))}</b></td></tr>`}).join('')+
 `</tbody>${list.length>1?`<tfoot><tr><td class=nm colspan=2>TOTAL</td>${tot.map(v=>`<td class=n>${fmt(v)}</td>`).join('')}<td class=n>${fmt(tot.reduce((s,v)=>s+v,0))}</td></tr></tfoot>`:''}</table></div>`}
function pwv(){return `<p class=note style="padding:0 0 12px">Agents log in with their name and password. The default is <b>${DEFPW}</b>. Set a personal password for any agent below, then tell them. Passwords are stored as hashes, so existing ones can't be shown.</p>
 <div class=sheet><table><thead><tr><th class=nm>Agent</th><th>User ID</th><th>Password</th><th>New password</th><th></th></tr></thead><tbody>`+AG().map(a=>`<tr><td class=nm>${a.name}</td><td>${a.id}</td><td>${a.pw?'<b>Custom</b>':'Default ('+DEFPW+')'}</td><td><input class=in id=np-${a.k} placeholder="Type new password" style="padding:5px 8px;width:190px;background:#fff;color:#111"></td><td><button class="btn s" data-set=${a.k}>Save</button> <button class="btn g s" style="color:#111;border-color:#9fb0d4" data-rs=${a.k}>Reset</button></td></tr>`).join('')+'</tbody></table></div>'}

function render(){const a=isA(),m=S.m,me=AG().find(x=>x.k==S.me),list=a?AG():[me],lk=!!M(m).totals;
 $('#who2').innerHTML=(a?`<span id=ss class="ss ${S.ss[1]}">${S.ss[0]}</span><button class="btn g s" id=xl>Export Excel</button><button class="btn g s" id=gh>GitHub</button>`:'')+`<span><b>${a?'Admin':me.name}</b>${a?'':`<br><span class=ss>ID ${me.id}</span>`}</span><button class="btn g s" id=out>Log out</button>`;
 $('#wel').innerHTML=`<h2>Welcome, ${a?'Admin':me.name}</h2><p>${a?'Mark attendance, enter calls and set passwords. Changes save online automatically.':`User ID ${me.id} · your attendance and calls`}</p>`;
 const T=[['att','Attendance'],['calls','Calls'],...(a?[['perf','Performance']]:[]),['sum',a?'Summary':'My summary'],...(a?[['pw','Passwords']]:[])];
 $('#tabs').innerHTML=T.map(([k,t])=>`<button data-t="${k}" class="${k==S.tab?'on':''}">${t}</button>`).join('');
 const mb=`<div class=tbar>${MN.map(x=>`<button class="btn s${x==m?'':' g'}" data-mo=${x}>${MT[x].slice(0,3)} 2026${M(x).totals?' 🔒':''}</button>`).join('')}</div>`,
 dsel=!lk?`<span class=sp></span><select id=ds>${Array.from({length:dim(m)},(_,i)=>`<option value=${i+1}${i+1==ref(m)?' selected':''}>Day ${i+1}</option>`).join('')}</select>`:'',
 K=`<div id=kpi>${kpis(list)}</div>`;let h='';
 if(S.tab=='att')h=K+mb+(lk?'<div class=note>🔒 September is locked. Attendance is not tracked for this month, only call totals.</div>':`<div class=tbar><span class=lg>${Object.keys(ST).map(x=>`<i class=s${x}>${x}</i>${ST[x]} `).join('')}<i class=sOFF>OFF</i>Sunday</span>${dsel}</div>`+(a?`<div class=tbar>Tap a cell and pick from the list. Tap a date number to mark everyone present.</div>`:'')+attReg(list));
 else if(S.tab=='calls')h=K+mb+(lk?`<div class=tbar>🔒 September is locked: final call totals only.</div>`+sep(list):`<div class=tbar>${a?'Type each agent\'s calls for the day. Weeks (Mon–Sun) and totals add up automatically.':'Your calls per day, week and month.'}${dsel}</div>`+callReg(list));
 else if(S.tab=='perf')h=K+mb+`<div class=tbar>${dsel}</div>`+perf();
 else if(S.tab=='sum')h=summ(list);else if(S.tab=='pw'&&a)h=pwv();
 $('#main').innerHTML=h}

/* ---------- editing + saving ---------- */
function dirty(){S.pend=1;if(!tok&&!ls('mt')){ss('Not saved: connect GitHub','bad');$('#derr').textContent='';$('#dlg').showModal();return}tok=tok||ls('mt');ss('Saving…');clearTimeout(timer);timer=setTimeout(save,1200)}
function setAtt(k,d,v){const mm=M(S.m);((mm.att??={})[k]??={});v?mm.att[k][d]=v:delete mm.att[k][d]}
function upd(k){const tr=document.querySelector(`tr[data-r=${k}]`),at=S.tab=='att';tr.querySelectorAll('.sm,.tt').forEach(e=>e.remove());tr.insertAdjacentHTML('beforeend',at?sumA(k):sumC(k));$('#ft').innerHTML=at?foot():cfoot();$('#kpi').innerHTML=kpis(AG())}
const H=()=>({Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'});
async function save(){if(!isA())return;ss('Saving…');
 try{for(let i=0;i<3;i++){if(!S.sha){const g=await fetch(API+'?ref='+BR+'&t='+Date.now(),{headers:H()});if(g.ok)S.sha=(await g.json()).sha}
  const r=await fetch(API,{method:'PUT',headers:H(),body:JSON.stringify({message:'Update register',branch:BR,sha:S.sha||undefined,content:enc(JSON.stringify(S.d,null,1))})}),j=await r.json();
  if(r.ok){S.sha=j.content.sha;S.pend=0;return ss('Saved online ✓','ok')}
  if(r.status==409||r.status==422){S.sha=null;continue}if(r.status==401){tok='';ls('mt',null);$('#dlg').showModal();throw 'token rejected'}throw j.message}throw 'conflict'}catch(e){ss('Not saved: '+e,'bad')}}
addEventListener('beforeunload',e=>{if(S.pend){e.preventDefault();e.returnValue=''}});
async function connect(t){const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}`,{headers:{Authorization:'Bearer '+t}}),j=await r.json();
 if(!r.ok||!j.permissions?.push)throw 'This token cannot edit '+OWNER+'/'+REPO;tok=t;ls('mt',t);if(S.pend)save();else ss('GitHub connected','ok')}
async function load(){let t;try{const r=await fetch(API+'?ref='+BR+'&t='+Date.now(),{headers:{Accept:'application/vnd.github.raw+json'}});if(r.ok)t=await r.text()}catch(e){}
 if(!t)t=await(await fetch(FILE+'?t='+Date.now())).text();S.d=JSON.parse(t)}

/* ---------- Excel export (same layout as your register, live formulas) ---------- */
async function xl(){const m=S.m;if(M(m).totals)return alert('September is locked (totals only). Choose Oct, Nov or Dec.');
 if(!window.XLSX)await new Promise((r,j)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=r;s.onerror=j;document.head.append(s)});
 const n=dim(m),W=wk(m,n)+1,A=AG(),N=A.length,E=XLSX.utils,C=E.encode_col,D=DY(m),wb=E.book_new(),F=N+3;
 const aw=E.aoa_to_sheet([['Agent','User ID',...D,'P','A','L','FL','SL','Attendance %'],...A.map(a=>[a.name,a.id,...D.map(d=>att(m,a.k,d)||null)])]);
 A.forEach((a,i)=>{const r=i+2,g=`${C(2)}${r}:${C(n+1)}${r}`;['P','A','L','FL','SL'].forEach((x,j)=>aw[C(n+2+j)+r]={t:'n',f:`COUNTIF(${g},"${x}")`});aw[C(n+7)+r]={t:'n',z:'0.0%',f:`IFERROR(${C(n+2)}${r}/SUM(${C(n+2)}${r}:${C(n+6)}${r}),0)`}});
 aw['A'+F]={t:'s',v:'Present'};for(let c=2;c<=n+1;c++)aw[C(c)+F]={t:'n',f:`COUNTIF(${C(c)}2:${C(c)}${N+1},"P")`};
 aw['!ref']=`A1:${C(n+7)}${F}`;aw['!cols']=[{wch:22}];E.book_append_sheet(wb,aw,'Attendance');
 const fw=[],lw=[];D.forEach(d=>{const w=wk(m,d);if(fw[w]==null)fw[w]=d;lw[w]=d});
 const cw=E.aoa_to_sheet([['Agent','User ID',...D,...fw.map((_,i)=>'Week '+(i+1)),'Month total'],...A.map(a=>[a.name,a.id,...D.map(d=>cl(m,a.k,d)||null)])]);cw['A'+F]={t:'s',v:'Team total'};
 for(let c=2;c<=n+W+2;c++){if(c>=n+2&&c<n+2+W){const w=c-n-2;A.forEach((a,i)=>cw[C(c)+(i+2)]={t:'n',f:`SUM(${C(1+fw[w])}${i+2}:${C(1+lw[w])}${i+2})`})}
  if(c==n+2+W)A.forEach((a,i)=>cw[C(c)+(i+2)]={t:'n',f:`SUM(${C(2)}${i+2}:${C(n+1)}${i+2})`});cw[C(c)+F]={t:'n',f:`SUM(${C(c)}2:${C(c)}${N+1})`}}
 cw['!ref']=`A1:${C(n+W+2)}${F}`;cw['!cols']=[{wch:22}];E.book_append_sheet(wb,cw,'Calls');
 XLSX.writeFile(wb,`Metro_Register_${MT[m]}_2026.xlsx`)}

/* ---------- events ---------- */
function put(td,v){if(td.textContent=='OFF'||!isA())return;setAtt(td.dataset.k,td.dataset.d,v);td.textContent=v;td.className='c s'+(v||'N');td.tabIndex=0;upd(td.dataset.k);dirty()}
const hidePop=()=>{$('#pop').hidden=true};
function showPop(td){const p=$('#pop'),r=td.getBoundingClientRect();S.pt=td;p.hidden=false;const w=p.offsetWidth,h=p.offsetHeight;p.style.left=Math.min(Math.max(8,r.left),innerWidth-w-8)+'px';p.style.top=(r.bottom+h+8>innerHeight-56?Math.max(8,r.top-h-4):r.bottom+4)+'px'}
addEventListener('scroll',hidePop,true);
document.addEventListener('click',async e=>{if(!e.target.closest('#pop,.c'))hidePop();const b=e.target.closest('button,th[data-d],.c[data-k]');if(!b)return;
 if(b.closest('#pop')){if(S.pt)put(S.pt,b.dataset.v);hidePop()}
 else if(b.dataset.t){S.tab=b.dataset.t;render()}
 else if(b.dataset.mo){S.m=b.dataset.mo;render()}
 else if(b.classList.contains('c')){if(isA()&&b.textContent.trim()!='OFF')showPop(b)}
 else if(b.tagName=='TH'){if(!isA())return;const d=b.dataset.d;AG().forEach(a=>{if(!att(S.m,a.k,d))setAtt(a.k,d,'P')});dirty();render()}
 else if(b.id=='xl')xl();else if(b.id=='gh'){$('#derr').textContent='';$('#dlg').showModal()}else if(b.id=='dc')$('#dlg').close();
 else if(b.id=='out'){try{sessionStorage.removeItem('ms')}catch(x){}location.reload()}
 else if(b.id=='ds2'){b.disabled=1;try{await connect($('#tk').value.trim());$('#tk').value='';$('#dlg').close()}catch(x){$('#derr').textContent=x.message||x}b.disabled=0}
 else if(b.dataset.set||b.dataset.rs){if(!isA())return;const k=b.dataset.set||b.dataset.rs,a=AG().find(x=>x.k==k),v=$('#np-'+k).value.trim();
  if(b.dataset.set){if(v.length<3)return alert('Use at least 3 characters.');a.pw=await pwh(k,v)}else delete a.pw;dirty();render()}
 else if(b.dataset.r){R=b.dataset.r;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x==b));$('#who').hidden=R=='admin';$('#err').textContent=''}
 else if(b.id=='go')login()});
document.addEventListener('keydown',e=>{const t=e.target;if(e.key=='Enter'&&t.id=='pw')return login();if(e.key=='Escape')hidePop();
 if((e.key=='Enter'||e.key==' ')&&t.classList?.contains('c')&&isA()){e.preventDefault();t.click()}});
document.addEventListener('change',e=>{const t=e.target;if(t.id=='ds'){S.day[S.m]=+t.value;render()}
 else if(t.classList.contains('ci')&&isA()){const mm=M(S.m),v=Math.max(0,parseInt(t.value)||0),{k,d}=t.dataset;((mm.calls??={})[k]??={});v?mm.calls[k][d]=v:delete mm.calls[k][d];t.value=v||'';upd(k);dirty()}});

/* ---------- login ---------- */
async function login(){const p=$('#pw').value;$('#err').textContent='';
 if(R=='admin'){if(await sha('admin:'+p.trim().toLowerCase())==ADMIN_HASH)return enter({role:'admin'});return $('#err').textContent='Wrong admin password.'}
 const k=$('#who').value;if(!k)return $('#err').textContent='Choose your name.';
 const a=AG().find(x=>x.k==k);if(await pwh(k,p)==(a.pw||await pwh(k,DEFPW)))return enter({role:'agent',me:k});$('#err').textContent='Wrong password. Ask your admin if you forgot it.'}
function enter(s){try{sessionStorage.setItem('ms',JSON.stringify(s))}catch(e){}S.role=s.role;S.me=s.me||null;S.tab='m';$('#gate').hidden=true;$('#app').hidden=false;tok=ls('mt')||'';render()}
(async()=>{try{await load()}catch(e){$('#err').textContent='Could not load team data. Refresh the page.';return}
 $('#who').innerHTML='<option value="">Select your name…</option>'+AG().map(a=>`<option value=${a.k}>${a.name} · ${a.id}</option>`).join('');
 try{const s=JSON.parse(sessionStorage.getItem('ms'));if(s&&(s.role=='admin'||AG().some(a=>a.k==s.me)))enter(s)}catch(e){}})();
</script></body></html>
