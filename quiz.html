<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1430"><title>Metro Team · MoMo Win-Back Challenge</title>
<link rel="icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1430;--navy2:#16275a;--gold:#d9a826;--gold2:#f3cf63;--ac:#3b72ea;--ok:#22c58b;--bad:#f0616d;--mu:#a9b7d6;--disp:Manrope,Inter,system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#fff;font:15px/1.5 Inter,system-ui,sans-serif;background:radial-gradient(800px 480px at 90% -10%,rgba(59,114,234,.6),transparent 60%),radial-gradient(600px 400px at 0% 110%,rgba(217,168,38,.25),transparent 60%),linear-gradient(135deg,#14224a,#070d22);background-attachment:fixed}
h1,h2,h3{font-family:var(--disp);margin:0}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.wrap{max-width:680px;margin:auto;padding:22px 16px 40px}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-top:4px solid var(--gold);border-radius:20px;padding:28px 26px;backdrop-filter:blur(8px);box-shadow:0 24px 60px rgba(3,8,24,.45);animation:in .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.logo{width:64px;height:64px;border-radius:16px;box-shadow:0 0 0 3px rgba(217,168,38,.6)}
.kick{color:var(--gold2);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.btn{background:linear-gradient(135deg,#f3cf63,#d9a826 60%,#b9871a);color:#2a1f00;border:0;border-radius:12px;padding:13px 22px;font:800 15px var(--disp);cursor:pointer;box-shadow:0 8px 20px rgba(217,168,38,.3);transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06)}.btn.g{background:rgba(255,255,255,.1);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.25)}
.in{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:#fff;font:inherit;margin:14px 0}
.in:focus{outline:2px solid var(--gold);outline-offset:1px}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 6px}.rules div{background:rgba(0,0,0,.22);border-radius:12px;padding:12px 10px;text-align:center;font-size:12.5px;color:var(--mu)}.rules b{display:block;font:800 20px var(--disp);color:#fff}
.hud{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:700}
.hud .sc{font:800 22px var(--disp);color:var(--gold2);font-variant-numeric:tabular-nums}.hud .sp{flex:1}
.chip{background:rgba(255,255,255,.1);border-radius:999px;padding:4px 12px;font-size:13px}.chip.fire{background:linear-gradient(135deg,#ff9a3c,#f0616d);box-shadow:0 0 18px rgba(255,140,60,.5)}
.prog{height:6px;background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden;margin-bottom:6px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),#6aa0ff);transition:width .4s}
.tm{height:10px;background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden;margin:14px 0 20px}.tm i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--ok),var(--gold2));border-radius:9px}.tm.low i{background:linear-gradient(90deg,var(--bad),#ff9a3c)}
.scn{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2);font-weight:700}
.q{font:800 21px/1.3 var(--disp);margin:6px 0 4px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin-top:10px;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font:inherit;cursor:pointer;transition:transform .12s,background .15s,border-color .15s}
.opt:hover:not(:disabled){background:rgba(255,255,255,.13);border-color:var(--gold);transform:translateX(4px)}
.opt b{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.12);font:800 13px var(--disp)}
.opt:disabled{cursor:default}.opt.ok{background:rgba(34,197,139,.25);border-color:var(--ok);animation:pop .4s}.opt.bad{background:rgba(240,97,109,.25);border-color:var(--bad);animation:shk .4s}.opt.out{opacity:.25;text-decoration:line-through}
@keyframes pop{50%{transform:scale(1.03)}}@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.ll{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}.ll button{flex:1;min-width:130px;padding:9px 12px;font-size:13px}.ll button:disabled{opacity:.35;cursor:default}
.fb{margin-top:16px;padding:14px 16px;border-radius:14px;background:rgba(0,0,0,.25);border-left:4px solid var(--gold)}.fb.ok{border-color:var(--ok)}.fb.bad{border-color:var(--bad)}.fb b{font-family:var(--disp)}.fb p{margin:4px 0 12px;color:#dbe4f7}
.big{font:800 64px/1 var(--disp);color:var(--gold2);text-align:center;margin:8px 0}
.rank{text-align:center;font:800 24px var(--disp)}.sub{text-align:center;color:var(--mu);margin:4px 0 18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}.stats div{background:rgba(0,0,0,.22);border-radius:12px;padding:12px;text-align:center;color:var(--mu);font-size:12px}.stats b{display:block;font:800 22px var(--disp);color:#fff}
.lb{width:100%;border-collapse:collapse;margin:8px 0 20px;font-size:14px}.lb td{padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.1)}.lb td:last-child{text-align:right;font-weight:800;color:var(--gold2)}.lb tr.me td{background:rgba(217,168,38,.15)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1}
.mute{position:fixed;right:14px;top:12px;z-index:60;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:12px}
@media(max-width:520px){.card{padding:22px 16px}.q{font-size:18px}.big{font-size:52px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<button class="mute" id="mt" type="button">Sound on</button>
<canvas id="fx"></canvas>
<div class="wrap" id="app"></div>
<script>
const QO=[
{s:"Call flow",q:"Which words open the inactive-customer call?",o:["Good day, this is MTN billing", "Y’ello, my name is [Agent Name], calling you from MTN Mobile Money", "Hello, who is this?", "Dear customer, you owe MTN"],a:1,e:"The script opens with Y’ello, your name and MTN Mobile Money, then confirms who you are speaking with."},
{s:"Inactive script",q:"What is the PRIMARY offer in the inactive MoMo customer script?",o:["50% bonus on 1ZED minutes", "K2 bonus on a K100 deposit", "PIN Reset Cashback: reset the PIN, transact and earn K5", "10% cashback on fees"],a:2,e:"PIN Reset Cashback (K5) is always pitched first."},
{s:"Inactive script",q:"What does Offer 1 give the customer?",o:["50% bonus on all 1ZED minutes bought with Mobile Money", "K5 cashback", "1.5GB for 8 days", "K2 on any deposit"],a:0,e:"Offer 1 is a 50% bonus on all 1ZED minutes when paying with Mobile Money."},
{s:"Inactive script",q:"Offer 2: a customer buys a K10 bundle. What do they get?",o:["500MB for 3 days", "1.5GB for 8 days plus a 768MB gift", "3GB for 30 days", "Double airtime"],a:1,e:"K10 gives 1.5GB for 8 days plus a bonus 768MB gift."},
{s:"Inactive script",q:"Offer 3 gives 10% instant cashback on MoMo fees. What must the customer do?",o:["Buy airtime", "Deposit K100 at an agent", "Send K100 or more to another MoMo number", "Reset their PIN twice"],a:2,e:"Offer 3 applies when sending K100 or more to another MoMo number."},
{s:"Inactive script",q:"Offer 4 gives a K2 bonus. When is it earned?",o:["When depositing K100 or more at an agent", "When sending K50", "When buying a bundle", "When calling support"],a:0,e:"Offer 4 is a K2 bonus for depositing K100 or more at any MoMo Agent."},
{s:"Security",q:"What must every agent say in the mandatory security education?",o:["Share your PIN with MTN staff only", "MTN will never ask for your MoMo PIN, so keep it private", "PIN is needed to confirm the offer", "Write your PIN on your SIM pack"],a:1,e:"The mandatory line: MTN will never ask for your MoMo PIN."},
{s:"Inactive script",q:"How does the inactive-customer call close?",o:["Goodbye", "Thank you for your time, Mr./Ms. [Customer Name]. Have a Y’ello day!", "Call us if you need anything", "Please hold"],a:1,e:"Close with a thank-you using the customer’s name and Have a Y’ello day."},
{s:"Inactive script",q:"A PIN reset fails because of KYC. What do you tell the customer?",o:["Try again tomorrow", "Visit the nearest MTN Service Centre with an NRC or Passport; updates take up to 72 hours", "Send the NRC by SMS", "Buy a new SIM"],a:1,e:"KYC issues are fixed at an MTN Service Centre with NRC or Passport, within 72 hours."},
{s:"Quality call",q:"How many steps are in the Quality Call Flow?",o:["Four", "Five", "Six", "Eight"],a:2,e:"Introduction, Confirmation, Ask for time, Reason, Sell, Thank and Close."},
{s:"Quality call",q:"Which step comes right after Confirmation?",o:["Sell the product", "Ask for the customer’s time", "Reason for the call", "Close the call"],a:1,e:"You earn permission before you pitch."},
{s:"Quality call",q:"What should you do if the customer says it is a bad time?",o:["Pitch quickly anyway", "Hang up", "Offer to call back at a better time", "Ask them to call you"],a:2,e:"Respect the answer and offer a callback."},
{s:"Inactive script",q:"A customer who forgot their PIN is eligible for the reset offer. Which offer do you pitch first?",o:["Offer 1 (1ZED minutes)", "Offer 4 (K2 bonus)", "PIN Reset Cashback (K5)", "Offer 2 (data)"],a:2,e:"Always follow the order: primary, then secondary, then tertiary.",d:1},
{s:"Inactive script",q:"The customer says, I want to send K150 to my sister. Which offer fits best?",o:["Offer 3: 10% cashback on fees for sending K100+", "Offer 4: K2 for depositing", "Offer 1: 1ZED bonus", "Offer 2: data bundle"],a:0,e:"Sending K100 or more to a MoMo number is Offer 3.",d:1},
{s:"Inactive script",q:"How is the K2 for Offer 4 awarded?",o:["Paid after 72 hours", "Customer activates the offer first, then deposits K100+ at an agent; the K2 is instant", "Automatically, no activation needed", "Only on the first of the month"],a:1,e:"Activate first, then deposit K100 or more at an agent. The bonus is instant.",d:1},
{s:"Inactive script",q:"A customer resets their PIN. Which transactions earn the K5 cashback?",o:["Only deposits above K100", "Only airtime", "Any MoMo transaction or deposit after the reset", "Only sending money"],a:2,e:"Any MoMo transaction or deposit after resetting the PIN qualifies.",d:1},
{s:"Inactive script",q:"Can one customer benefit from more than one offer?",o:["No, only one ever", "Yes, as long as they are eligible for those offers", "Only two offers", "Only if they call back"],a:1,e:"Customers can use more than one offer when eligible.",d:1},
{s:"Inactive script",q:"What condition do you state in the generic secondary pitch (Offer 1 or 2)?",o:["Purchase using Mobile Money before the Campaign End Date", "Buy after the campaign ends", "Pay cash at a shop", "Visit a service centre"],a:0,e:"They must purchase using Mobile Money before the Campaign End Date.",d:1},
{s:"Inactive script",q:"What must the customer do for a tertiary offer (3 or 4) before the Campaign End Date?",o:["Only wait for an SMS", "Activate it and transact", "Reset the PIN again", "Change their SIM"],a:1,e:"Tertiary offers must be activated, then used before the campaign ends.",d:1},
{s:"Inactive script",q:"You reach the wrong party and the SIM is no longer theirs. What do you do?",o:["Pitch the offer anyway", "Thank them, advise Change of Ownership at an MTN shop, capture feedback, end the call", "Ask for the owner’s PIN", "Ask for their NRC"],a:1,e:"The script says to advise Change of Ownership at an MTN shop, capture feedback and end the call.",d:1},
{s:"Inactive script",q:"Which is NOT one of the inactivity reasons you capture?",o:["Forgot PIN", "Lost SIM", "Network", "Poor agent service"],a:3,e:"Capture list: Forgot PIN, Lost SIM, KYC mismatch, Financial, Network, Security, Other.",d:1},
{s:"Security",q:"While you reset a PIN, the customer starts reading out their PIN. What do you do?",o:["Write it down", "Stop them and remind them MTN never asks for the PIN", "Repeat it back to confirm", "Ask them to also share OTP"],a:1,e:"Never take a PIN. Remind the customer to keep it private.",d:1},
{s:"Quality call",q:"A good reason for the call should be:",o:["Long and detailed", "One or two simple sentences tied to something relevant to the customer", "Full of technical terms", "Left out until the end"],a:1,e:"State clearly and simply why you are calling, one or two sentences.",d:1},
{s:"Quality call",q:"Which is NOT one of the six things QA usually scores?",o:["Talk-to-listen ratio", "Accurate call notes and disposition", "Tone and professionalism", "Number of calls ended early"],a:3,e:"QA scores talk-to-listen ratio, script adherence, resolution, call control, tone, and notes.",d:1},
{s:"Quality call",q:"The customer says no. What should the agent still do?",o:["Hang up at once", "Thank them, confirm the outcome and log the disposition", "Argue the benefits again", "Skip the notes"],a:1,e:"Close every call properly and log accurate notes, even on a no.",d:1},
{s:"Cashback · Minimum",q:"What is the smallest cash-in amount that qualifies for MoMo Cash-In Cashback?",o:["K1","K5","K50","K100"],a:1,e:"Customers can deposit any amount from K5 and still earn cashback."},
{s:"Cashback · Rates",q:"A customer deposits K100 at a MoMo agent. How much cashback do they earn?",o:["K1","K2","K5","K10"],a:0,e:"K5 – K249.99 earns 1% of the deposit, so K100 gives K1."},
{s:"Cashback · Rates",q:"A customer deposits K250. What cashback do they get?",o:["K1","K2","K2.50","K5"],a:1,e:"K250 – K999.99 earns a flat K2."},
{s:"Cashback · Rates",q:"A customer cashes in K1,000. What cashback do they earn?",o:["K2","K5","K10","K1,000 × 1% = K10"],a:1,e:"K1,000 – K9,999.99 earns a flat K5."},
{s:"Cashback · Maximum",q:"What is the most cashback a customer can earn on a single deposit?",o:["K5","K10","K50","There is no limit"],a:1,e:"Cashback is capped at K10 per deposit. K10,000 and above earns K10."},
{s:"Cashback · Objection",q:"A customer says, “So it’s a once-off reward?” What do you say?",o:["Yes, only the first deposit qualifies.","No, they earn cashback on every qualifying cash-in, up to K10 per deposit.","Only one deposit per week qualifies.","Yes, but they can reapply next month."],a:1,e:"It is not a once-off reward. Every qualifying cash-in earns cashback, so we encourage them to keep depositing."},
{s:"Cashback · How to qualify",q:"Where does the customer go to earn Cash-In Cashback?",o:["Any MoMo agent, to cash in to their wallet","Only MTN Service Centres","Only the MoMo App","Any bank branch"],a:0,e:"They visit any MoMo agent and deposit cash into their MoMo wallet."},
{s:"Cashback · Offer end",q:"Besides the end date, when can the Cash-In Cashback offer end?",o:["When the customer has earned K10 once","Sooner, if the campaign cashback fund is used up","When the agent stops calling","It cannot end earlier"],a:1,e:"The offer ends on the campaign date, or sooner if the cashback fund is used up, so we tell customers not to wait."},
{s:"KYC Segment",q:"A customer needs a KYC update before they can earn cashback. What do you ask them to do?",o:["Send their MoMo PIN by SMS","Visit the approved KYC update point with a valid ID","Dial *115# and share their ID number with you","Deposit K5 first, then update KYC"],a:1,e:"They visit the approved KYC point (e.g. nearest MTN Service Centre) with a valid ID so the wallet can be activated."},
{s:"KYC Segment",q:"How should you explain a KYC update to the customer?",o:["It is a fee to keep the account open","It simply means confirming their details so the wallet can be activated","It is a new SIM registration","It is a loan check"],a:1,e:"Keep it simple: KYC confirms their details so their wallet can be activated. Then they can deposit and earn cashback."},
{s:"Security",q:"During a call the customer offers to give you their MoMo PIN to “speed things up”. What do you do?",o:["Take it and complete the process for them","Tell them never to share it, because we never ask for the MoMo PIN","Ask for only the first two digits","Note it down for verification"],a:1,e:"We never ask for a MoMo PIN over the phone. Remind the customer not to share it with anyone, not even MTN agents."},
{s:"Security",q:"What is the only official channel MTN MoMo uses to contact customers about prizes and offers?",o:["WhatsApp","115","Facebook Messenger","Any unknown number"],a:1,e:"MTN MoMo only contacts customers through 115. Customers should not share their PIN or personal details with anyone claiming they won a prize."},
{s:"100% BOR · Offer",q:"A customer buys ZMW10 airtime through MoMo under the 100% Bonus on Recharge offer. What do they get?",o:["ZMW5 bonus","ZMW10 bonus for MTN-to-MTN calls","ZMW20 bonus for any network","No bonus on amounts under ZMW20"],a:1,e:"The bonus is 100% of the amount recharged, for MTN-to-MTN calls. ZMW10 recharge gives ZMW10 extra."},
{s:"100% BOR · Steps",q:"Which is the correct path for a customer to recharge for themselves on *115#?",o:["*115# → Option 1 → Option 4 → Buy for Self","*115# → Option 4 (Airtime & Bundles) → Option 1 (Airtime) → Buy for Self","*115# → Option 2 → Option 3 → Buy for Self","*115# → Option 5 → Option 1 → Buy for Other"],a:1,e:"Dial *115#, select 4 for Airtime & Bundles, 1 for Airtime, choose Buy for Self, enter the amount and confirm with the MoMo PIN."},
{s:"100% BOR · Expiry",q:"A customer recharges at 3pm and gets bonus airtime. When does the bonus expire?",o:["Midnight the same day","3pm the next day","After 7 days","After 30 days"],a:1,e:"Bonus airtime is valid for 24 hours from the time of purchase, not until midnight."},
{s:"100% BOR · Call list",q:"The call list shows compatible_device = No. What should you do?",o:["Push the MoMo App anyway","Skip the app push and guide them through the *115# steps","End the call","Ask them to change their phone"],a:1,e:"Do not push the app to a customer whose device is not compatible. Use the *115# steps only."},
{s:"100% BOR · App paths",q:"momoapp_download_date is blank. Which path do you use?",o:["App Path 1: app not downloaded, offer to download it on the call","App Path 2: downloaded but not using it","App Path 3: active user","No app path applies"],a:0,e:"A blank download date means the app has not been downloaded, so use App Path 1."},
{s:"100% BOR · App paths",q:"The app was downloaded, but last_app_usage_date is blank or old. Which path applies?",o:["App Path 1","App Path 2: ask them to open the app and use it for their next recharge","App Path 3","Skip the app section"],a:1,e:"Downloaded but not using the app is App Path 2. Encourage them to open it today and use it for their next recharge."},
{s:"100% BOR · App paths",q:"A recent last_app_usage_date shows the customer is an active app user. What do you say?",o:["Ask them to download the app again","Thank them for using the app and encourage them to use it for today’s recharge","Tell them to use *115# only","Ask them to reset their PIN"],a:1,e:"Active users are App Path 3: thank them and encourage them to use the app for the 100% Bonus on Recharge."},
{s:"100% BOR · Device",q:"The customer’s device_type is iPhone. Where do you send them to get the app?",o:["Google Play Store","The App Store, search “MoMo from MTN”, then tap Get","An SMS link","The nearest agent"],a:1,e:"iPhone users go to the App Store, search for MoMo from MTN and tap Get. Android users use the Google Play Store and tap Install."},
{s:"100% BOR · Biometrics",q:"has_biometrics is Yes. What can you mention?",o:["They can log in with fingerprint or face, where their phone supports it","They no longer need a PIN for transactions","They can skip the *115# steps","They will get extra bonus airtime"],a:0,e:"Mention that they can log in with fingerprint or face, where the phone supports it. It is quick and secure."},
{s:"100% BOR · FAQ",q:"A customer asks, “Do I have to use the MoMo App to get the bonus?”",o:["Yes, the app is the only way","No, they can still recharge through *115#. The app is an extra, faster option","Only iPhone users can get the bonus","Only after they update KYC"],a:1,e:"The app is optional. The subscriber can still recharge through *115#."},
{s:"100% BOR · FAQ",q:"A customer says they downloaded the app but cannot log in. What do you do?",o:["Ask for their PIN to check the account","Advise a PIN reset through *115# or a visit to an MTN service centre with a valid ID, and record the disposition","Ask them to read the login details to you","Tell them to uninstall the app"],a:1,e:"Never ask for the PIN or login details. Advise a PIN reset via *115# or a visit to a service centre with valid ID, and record the disposition."},
{s:"100% BOR · FAQ",q:"A customer forgot their PIN. What do you tell them?",o:["Read out the PIN from the system","Reset it by dialling *115# and following the PIN reset prompts, or visit an MTN service centre with a valid ID","Wait 24 hours for it to reset itself","Create a new wallet"],a:1,e:"PIN reset is done through *115# prompts or at a service centre with valid ID. We never see or share their PIN."},
{s:"Call flow",q:"After presenting the 100% BOR offer, what is the disposition question you ask?",o:["“Can I have your PIN to start?”","“Are you able to try this right now, or would you like me to walk you through the steps?”","“Will you call us back tomorrow?”","“Do you want to cancel the offer?”"],a:1,e:"This question moves the customer toward the goal: Committed to Recharge, Needs Guidance or Not Interested."},
{s:"Inactive script",q:"A customer says they will only deposit K80 at an agent. Which statement is correct?",o:["Offer 4 applies, because any deposit at a MoMo agent earns the K2 bonus","Offer 4 does not apply, because it needs a deposit of K100 or more","Offer 3 applies, because depositing counts as sending money to a MoMo number","Offer 4 applies once they activate it, whatever amount they deposit"],a:1,e:"Offer 4 is a K2 bonus for depositing K100 or more at a MoMo agent. K80 is below that.",d:1},
{s:"Inactive script",q:"A customer wants 1ZED minutes bought with airtime from their phone, not Mobile Money. Does Offer 1 apply?",o:["Yes, the 50% bonus applies to every 1ZED purchase they make","No, the 50% bonus is only for 1ZED minutes bought with Mobile Money","Yes, but the bonus drops to 25% when they pay with airtime","No, because Offer 1 only covers data bundles and not minutes"],a:1,e:"Offer 1 is a 50% bonus on all 1ZED minutes bought with Mobile Money.",d:1},
{s:"Inactive script",q:"A customer activates Offer 4 and deposits K100 at a MoMo agent. When do they get the K2?",o:["Instantly","After 72 hours","At the end of the campaign","The next working day"],a:0,e:"Activate first, then deposit K100 or more. The K2 bonus is instant.",d:1},
{s:"Inactive script",q:"The customer declines the PIN Reset Cashback. Which offers can you pitch next as the secondary offer?",o:["Offer 1 or Offer 2","Offer 3 or Offer 4","Repeat the PIN Reset Cashback","Close the call straight away"],a:0,e:"The order is primary, then secondary (Offer 1 or 2), then tertiary (Offer 3 or 4).",d:1},
{s:"Inactive script",q:"A customer’s PIN reset failed because of KYC and they visit a Service Centre today. How long can the update take?",o:["Up to 24 hours","Up to 72 hours","Up to 7 days","It is instant"],a:1,e:"KYC issues are fixed at an MTN Service Centre with NRC or Passport, within 72 hours.",d:1},
{s:"Inactive script",q:"A customer says they stopped using MoMo because they have no money to transact. Which inactivity reason do you capture?",o:["Network","Security","Financial","Other"],a:2,e:"Capture list: Forgot PIN, Lost SIM, KYC mismatch, Financial, Network, Security, Other.",d:1},
{s:"Inactive script",q:"A customer says they stopped using MoMo because they fear fraud and scams. Which inactivity reason fits best?",o:["Security","Financial","Lost SIM","KYC mismatch"],a:0,e:"Fear of fraud and scams is captured as Security.",d:1},
{s:"Security",q:"A customer says someone on WhatsApp told them they won a MoMo prize and asked for their PIN. What do you advise?",o:["Reply to confirm the prize but keep the PIN hidden","MTN MoMo only contacts customers about prizes through 115, so never share the PIN","Share the PIN only if the prize is worth more than K100","Block the number and wait for the next message from them"],a:1,e:"MTN MoMo only contacts customers through 115. Never share your PIN or personal details with anyone claiming you won a prize.",d:1},
{s:"Quality call",q:"In the Quality Call Flow, which step comes immediately before Sell?",o:["Reason for the call","Ask for the customer’s time","Confirmation","Thank and close"],a:0,e:"The flow is Introduction, Confirmation, Ask for time, Reason, Sell, Thank and Close.",d:1},
{s:"Quality call",q:"An agent talks for almost the whole call and rarely lets the customer respond. Which QA area is hit hardest?",o:["Accurate call notes","Talk-to-listen ratio","Tone and professionalism","Call resolution"],a:1,e:"Talk-to-listen ratio measures how much the agent talks compared with how much they listen.",d:1},

const RANKS=[[40,"Rookie on the Floor","Every legend started here. Play again to climb."],[60,"Rising Agent","Solid instincts. A few more rounds and you’re there."],[80,"Call Pro","Customers are in safe hands with you."],[100,"Team Star","Nearly flawless. Brilliant work."],[101,"MoMo Legend","Perfect score. The floor bows to you."]];
const N=10,SECS=15,$=s=>document.querySelector(s),app=$("#app");
let S={},snd=true,timer=null,AC=null;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function beep(f,d,t="sine",v=.08,w=0){if(!snd)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);const T=AC.currentTime+w;g.gain.setValueAtTime(v,T);g.gain.exponentialRampToValueAtTime(.0001,T+d);o.start(T);o.stop(T+d)}catch(e){}}
const good=()=>{beep(660,.12,"triangle");beep(880,.18,"triangle",.08,.1)},badS=()=>{beep(200,.25,"sawtooth",.06)},tick=()=>beep(500,.05,"square",.03);
$("#mt").onclick=e=>{snd=!snd;e.target.textContent=snd?"Sound on":"Sound off"};
function lb(){try{return JSON.parse(localStorage.getItem("mt_quiz_lb")||"[]")}catch(e){return[]}}
function saveLb(n,s){const l=lb();l.push({n,s,d:Date.now()});l.sort((a,b)=>b.s-a.s);try{localStorage.setItem("mt_quiz_lb",JSON.stringify(l.slice(0,20)))}catch(e){}return l}
function home(){clearInterval(timer);let nm="";try{nm=localStorage.getItem("mt_quiz_name")||""}catch(e){}
app.innerHTML=`<div class=card style="text-align:center"><img class=logo src=logo.png alt="" onerror="this.style.display='none'"><div class=kick style="margin-top:14px">Metro Team</div><h1 style="font-size:32px;margin:4px 0">MoMo Win-Back Challenge</h1><p style="color:var(--mu);margin:0">${N} questions from our MTN MoMo offer scripts. Beat the clock, build a streak, earn your rank.</p>
<div class=rules><div><b>${SECS}s</b>per question</div><div><b>🔥 x</b>streak bonus</div><div><b>2</b>lifelines</div></div>
<input class=in id=nm maxlength=24 placeholder="Enter your name" value="${esc(nm)}" autocomplete=off><button class=btn id=go style="width:100%">Start my shift</button></div>`;
$("#go").onclick=()=>{const n=$("#nm").value.trim();if(!n){$("#nm").focus();return}try{localStorage.setItem("mt_quiz_name",n)}catch(e){}start(n)};
$("#nm").onkeydown=e=>{if(e.key=="Enter")$("#go").click()}}
const HQ=t=>{let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))|0;return"q"+(h>>>0).toString(36)},
seenK=n=>"mt_quiz_seen:"+n.toLowerCase(),
pickQ=(n,hard=4)=>{let sn={};try{sn=JSON.parse(localStorage.getItem(seenK(n))||"{}")}catch(e){}
const age=q=>sn[HQ(q.q)]||0,take=(a,k)=>shuf(a).sort((x,y)=>age(x)-age(y)).slice(0,k),
G=GEN.map(f=>f()),nw=take(QS,Math.min(QS.length,N-G.length-2)),od=take(QO,N-G.length-nw.length),out=shuf(G.concat(nw,od)),now=Date.now();
out.filter(q=>!q.g).forEach(q=>sn[HQ(q.q)]=now);
const ks=Object.keys(sn);if(ks.length>400)ks.sort((a,b)=>sn[a]-sn[b]).slice(0,ks.length-400).forEach(k=>delete sn[k]);
try{localStorage.setItem(seenK(n),JSON.stringify(sn))}catch(e){}return out};
const MAXP=N*150+Array.from({length:N},(_,i)=>Math.min(i,5)*10).reduce((a,b)=>a+b,0),PC=p=>Math.min(100,Math.round((+p||0)/MAXP*100));
function start(n){S={n,qs:pickQ(n),i:0,pts:0,tt:0,ok:0,st:0,best:0,fifty:1,extra:1};beep(440,.1);ask()}
function ask(){const q=S.qs[S.i];q.opts=shuf(q.o.map((t,k)=>({t,c:k==q.a})));S.t=SECS;S.done=false;S.start=Date.now();
app.innerHTML=`<div class=card><div class=hud><span class=sc id=sc>${PC(S.pts)}%</span>${S.st>1?`<span class="chip fire">🔥 ${S.st} streak</span>`:""}<span class=sp></span><span class=chip>${S.i+1} / ${N}</span></div>
<div class=prog><i style="width:${S.i/N*100}%"></i></div><div class=tm id=tm><i id=tb></i></div>
<div class=scn>${q.s}</div><div class=q>${q.q}</div><div id=os>${q.opts.map((o,k)=>`<button class=opt data-k=${k}><b>${"ABCD"[k]}</b>${o.t}</button>`).join("")}</div>
<div class=ll><button class="btn g" id=l1 ${S.fifty?"":"disabled"}>✂ 50/50</button><button class="btn g" id=l2 ${S.extra?"":"disabled"}>⏱ +10 seconds</button></div><div id=fb></div></div>`;
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
$("#l1").onclick=()=>{if(S.done||!S.fifty)return;S.fifty=0;$("#l1").disabled=true;shuf(q.opts.map((o,k)=>k).filter(k=>!q.opts[k].c)).slice(0,2).forEach(k=>{const b=document.querySelector(`.opt[data-k="${k}"]`);b.classList.add("out");b.disabled=true});beep(520,.1)};
$("#l2").onclick=()=>{if(S.done||!S.extra)return;S.extra=0;$("#l2").disabled=true;S.t+=10;beep(620,.1)};
clearInterval(timer);timer=setInterval(()=>{if(S.done)return;const rem=Math.max(0,(S.start+S.t*1000-Date.now())/1000);S.rem=rem;const tb=$("#tb");tb.style.width=Math.min(100,rem/S.t*100)+"%";$("#tm").classList.toggle("low",rem<6);if(rem<6&&Math.abs(rem-Math.round(rem))<.06)tick();if(rem<=0)pick(-1)},100)}
function pick(k){if(S.done)return;S.done=true;S.tt+=Math.min(SECS,(Date.now()-S.start)/1000);clearInterval(timer);const q=S.qs[S.i],right=k>=0&&q.opts[k].c;let gain=0;
document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(q.opts[j].c)b.classList.add("ok");else if(j==k)b.classList.add("bad")});
if(right){S.st++;S.best=Math.max(S.best,S.st);S.ok++;gain=100+Math.round(Math.min(S.rem,SECS)/SECS*50)+Math.min(S.st-1,5)*10;S.pts+=gain;good();if(S.st>=3)boom(.35)}else{S.st=0;badS()}
$("#sc").textContent=PC(S.pts)+"%";const last=S.i==N-1;
$("#fb").innerHTML=`<div class="fb ${right?"ok":"bad"}"><b>${right?`Correct! +${gain} points`:k<0?"Time’s up!":"Not quite."}</b><p>${q.e}</p><button class=btn id=nx>${last?"See my results":"Next call"}</button></div>`;
$("#nx").onclick=()=>{S.i++;last?end():ask()};$("#nx").focus()}
function end(){const pc=Math.round(S.ok/N*100),r=RANKS.find(x=>pc<x[0]),l=saveLb(S.n,S.pts),top=l.slice(0,5),me=l.findIndex(x=>x.n==S.n&&x.s==S.pts);if(pc>=60)boom(1);try{if(parent!==window)parent.postMessage({type:'mt-quiz',score:S.pts,ok:S.ok,n:N,avg:+(S.tt/N).toFixed(1)},location.origin)}catch(e){}
app.innerHTML=`<div class=card><div class=kick style="text-align:center">Shift complete</div><div class=big>${PC(S.pts)}%</div><div class=rank>${r[1]}</div><div class=sub>${r[2]}</div>
<div class=stats><div><b>${S.ok}/${N}</b>correct</div><div><b>${pc}%</b>accuracy</div><div><b>🔥 ${S.best}</b>best streak</div></div>
<h3 style="font-size:16px">Leaderboard <small style="color:var(--mu);font-weight:500">(this device)</small></h3><table class=lb>${top.map((x,j)=>`<tr class="${j==me?"me":""}"><td>${["🥇","🥈","🥉"][j]||j+1}</td><td>${esc(x.n)}</td><td>${PC(x.s)}%</td></tr>`).join("")}</table>
<div class=row><button class=btn id=ag>Play again</button><button class="btn g" id=hm>Change name</button></div></div>`;
$("#ag").onclick=()=>start(S.n);$("#hm").onclick=home}
function boom(power){const c=$("#fx"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const cols=["#f3cf63","#d9a826","#3b72ea","#22c58b","#fff"],P=Array.from({length:Math.round(120*power)},()=>({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,s:4+Math.random()*5,c:cols[Math.random()*5|0],r:Math.random()*6}));let f=0;(function d(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<110)requestAnimationFrame(d);else x.clearRect(0,0,c.width,c.height)})()}
home();
</script></body></html>
