function chWho(){let nm="",id="";try{nm=(localStorage.getItem("mt_quiz_name")||"").trim().toLowerCase();id=localStorage.getItem("mt_chal_me")||""}catch(e){}
 const t=CH.team||[],m=t.find(x=>x.name.trim().toLowerCase()==nm)||t.find(x=>x.id==id);CH.me=m?m.id:"";CH.meName=m?m.name:"";return CH.me}
function chSetMe(id){const m=(CH.team||[]).find(x=>x.id==id);if(!m)return;try{localStorage.setItem("mt_chal_me",m.id);localStorage.setItem("mt_quiz_name",m.name)}catch(e){}CH.me=m.id;CH.meName=m.name}
async function chList(){const j=await chApi({op:"list",me:CH.me});if(!Array.isArray(j.rows))throw new Error(j.error||"x");CH.list=j.rows.filter(c=>c.game==CH_GAME)}
const chMine=c=>c.fid==CH.me?(c.fscore==null?null:{s:c.fscore,x:c.fx}):(c.tscore==null?null:{s:c.tscore,x:c.tx});
const chOpp=c=>c.fid==CH.me?(c.tscore==null?null:{s:c.tscore,x:c.tx}):(c.fscore==null?null:{s:c.fscore,x:c.fx});
const chOn=c=>c.fid==CH.me?c.tn:c.fn;
const chBetter=(a,ax,b,bx)=>a!=b?(a>b?1:-1):ax!=bx?(ax>bx?1:-1):0;
function chSummary(c){const m=chMine(c),o=chOpp(c),n=esc(chOn(c));if(!m)return"";
 if(!o)return`You: <b>${chFmt(m.s,m.x)}</b>. Waiting for <b>${n}</b> to play.`;
 const w=chBetter(m.s,m.x,o.s,o.x);
 return`${w>0?"🏆 You beat <b>"+n+"</b>":w<0?"<b>"+n+"</b> won this one":"🤝 Draw with <b>"+n+"</b>"}<br>You: ${chFmt(m.s,m.x)}<br>${n}: ${chFmt(o.s,o.x)}`}
function chMsg(t){const m=$("#chmsg");if(m)m.textContent=t}
function chPaint(){const el=$("#chl");if(!el)return;const me=CH.me,L=CH.list;
 const inc=L.filter(c=>c.st=="pending"&&c.tid==me),rdy=L.filter(c=>c.st=="accepted"&&!chMine(c)),
  wt=L.filter(c=>(c.st=="pending"&&c.fid==me)||(c.st=="accepted"&&chMine(c)&&!chOpp(c))),
  dn=L.filter(c=>c.st=="done"||c.st=="declined").slice(0,8);
 const row=(c,t,b)=>`<div class=chr><div class=tx>${t}<small>${esc(chLabel(c))}</small></div>${b}</div>`,
  bt=(a,id,l,g)=>`<button class="btn${g?" g":""}" data-a="${a}" data-id="${esc(id)}">${l}</button>`;
 let h="";
 if(inc.length)h+=`<div class=chh>Challenges for you</div>`+inc.map(c=>row(c,`<b>${esc(c.fn)}</b> challenges you`,bt("accept",c.id,"Accept")+bt("decline",c.id,"Decline",1))).join("");
 if(rdy.length)h+=`<div class=chh>Ready to play</div>`+rdy.map(c=>CH.arm==c.id?
  `<div class=chr><div class=tx>vs <b>${esc(chOn(c))}</b><small>One attempt only. Once you press Start, leaving the page counts as a loss.</small></div>${bt("go",c.id,"Start now")}${bt("unarm",c.id,"Not yet",1)}</div>`
  :row(c,`vs <b>${esc(chOn(c))}</b>`,bt("play",c.id,"Play now"))).join("");
 if(wt.length)h+=`<div class=chh>Waiting</div>`+wt.map(c=>c.st=="pending"?row(c,`Waiting for <b>${esc(c.tn)}</b> to accept`,bt("cancel",c.id,"Cancel",1)):row(c,chSummary(c),"")).join("");
 if(dn.length)h+=`<div class=chh>Results</div>`+dn.map(c=>c.st=="declined"?row(c,c.fid==me?`<b>${esc(c.tn)}</b> declined`:`You declined <b>${esc(c.fn)}</b>`,""):row(c,chSummary(c),"")).join("");
 el.innerHTML=h||`<p class=chn>No challenges yet. Choose a colleague above and send one.</p>`}
async function chRefresh(){try{await chList();chPaint()}catch(e){const el=$("#chl");if(el)el.innerHTML=`<p class=chn>${esc(chErr(e))}</p>`}}
function chTimer(){clearInterval(CH.tm);CH.tm=setInterval(()=>{if(!$("#chl")){clearInterval(CH.tm);return}chRefresh()},12000)}
async function chAct(a,id){try{
 if(a=="play"){CH.arm=id;chPaint();return}
 if(a=="unarm"){CH.arm="";chPaint();return}
 if(a=="go"){await chPlay(id);return}
 const j=await chApi({op:"respond",id,me:CH.me,a});if(j.error)throw new Error(j.error);chMsg("");await chRefresh()
 }catch(e){chMsg(chErr(e));chRefresh()}}
async function chPlay(id){const c=CH.list.find(x=>x.id==id);if(!c)return;
 const j=await chApi({op:"start",id,me:CH.me});
 if(j.error=="forfeit"){CH.arm="";chMsg("You opened this challenge before without finishing it, so it now counts as a loss.");await chRefresh();return}
 if(j.error)throw new Error(j.error);
 clearInterval(CH.tm);CH.arm="";chStart({id:c.id,opp:chOn(c),seed:j.seed,set:j.set})}
async function chSend(){const to=$("#cho").value;if(!to){chMsg("Choose a colleague first.");return}
 const b=$("#chsend");b.disabled=true;
 try{const j=await chApi({op:"create",game:CH_GAME,from:CH.me,to,set:CH.set});if(j.error)throw new Error(j.error);
  const nm=(CH.team.find(x=>x.id==to)||{}).name||"";chMsg("Challenge sent to "+nm+". They will see it when they open this game.");$("#cho").value="";await chRefresh()}
 catch(e){chMsg(chErr(e))}b.disabled=false}
function chDraw(){const b=$("#chbody");if(!b)return;const T=CH.team.slice().sort((x,y)=>x.name.localeCompare(y.name));
 if(!CH.me){b.innerHTML=`<p class=chn>Who are you? Choose your name so your colleagues can find you.</p><select class=in id=chwho style="margin:8px 0 12px"><option value="">Choose your name…</option>${T.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("")}</select><button class=btn id=chok style="width:100%">Continue</button>`;
  $("#chok").onclick=()=>{const v=$("#chwho").value;if(!v)return;chSetMe(v);chDraw();chRefresh();chTimer()};return}
 b.innerHTML=`<p class=chn>You are <b>${esc(CH.meName)}</b> · <a href="#" id=chnot style="color:inherit">not you?</a></p>
<div class=chh>Challenge a colleague</div>
<select class=in id=cho style="margin:6px 0 10px"><option value="">Choose a colleague…</option>${T.filter(x=>x.id!=CH.me).map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("")}</select>
${CH_GAME=="typing"?`<div class=chs>${[30,60,120].map(s=>`<button class="btn g${CH.set==s?" on":""}" data-s="${s}">${s==120?"2 min":s+" sec"}</button>`).join("")}</div>`:""}
<button class=btn id=chsend style="width:100%">Send challenge</button><div class=chmsg id=chmsg></div><div id=chl></div>`;
 $("#chnot").onclick=e=>{e.preventDefault();CH.me="";CH.meName="";clearInterval(CH.tm);chDraw()};
 $("#chsend").onclick=chSend;
 document.querySelectorAll("[data-s]").forEach(x=>x.onclick=()=>{CH.set=+x.dataset.s;document.querySelectorAll("[data-s]").forEach(y=>y.classList.toggle("on",y==x))});
 $("#chl").onclick=e=>{const t=e.target.closest("[data-a]");if(t)chAct(t.dataset.a,t.dataset.id)}}
async function chHub(){clearInterval(timer);clearInterval(CH.tm);S.phase="";
 app.innerHTML=`<div class=card><div class=kick style="text-align:center">Head to head</div><h1 style="font-size:28px;margin:6px 0 4px;text-align:center">${CH_GAME=="typing"?"Typing duel":"Quiz duel"}</h1><p class=chn>Challenge a colleague. Once they accept, you both play the same ${CH_GAME=="typing"?"text":"questions"} and the better score wins. You each play when it suits you.</p><div id=chbody><p class=chn>Loading…</p></div><div class=row style="margin-top:18px"><button class="btn g" id=chback>Back</button></div></div>`;
 $("#chback").onclick=()=>{clearInterval(CH.tm);home()};
 try{await chTeam()}catch(e){const b=$("#chbody");if(b)b.innerHTML=`<p class=chn>${esc(chErr(e))}</p>`;return}
 chWho();chDraw();if(CH.me){await chRefresh();chTimer()}}
async function chBadge(){try{await chTeam();if(!chWho())return;await chList();
 const n=CH.list.filter(c=>(c.st=="pending"&&c.tid==CH.me)||(c.st=="accepted"&&!chMine(c))).length,b=$("#chb");
 if(b&&n)b.innerHTML=`⚔ Challenges <b>(${n} waiting)</b>`}catch(e){}}
async function chFinish(ch,score,x){const el=()=>$("#chres");let j,tries=0;
 try{while(true){try{j=await chApi({op:"result",id:ch.id,me:CH.me,score,x});break}catch(e){if(e.message=="noscript"||++tries>=3)throw e;await new Promise(r=>setTimeout(r,1500))}}
  if(j.error)throw new Error(j.error);
  if(el())el().innerHTML=`<b>⚔ Challenge vs ${esc(ch.opp)}</b><br>${chSummary(j.c)}`}
 catch(e){if(el())el().innerHTML=`Could not save your challenge result. ${esc(chErr(e))}`}}
const CH_GAME="typing";
const chLabel=c=>(c.set==120?"2 min":(c.set||60)+" sec")+" typing test";
const chFmt=(s,x)=>s+" WPM at "+x+"%";
function chStart(c){if(!S.dur0)S.dur0=S.dur;S.dur=c.set||60;S.name=CH.meName;S.chal=c;begin()}
function home(){clearInterval(timer);if(S.dur0){S.dur=S.dur0;S.dur0=0}let nm="";try{nm=localStorage.getItem("mt_quiz_name")||""}catch(e){}
 const best=lb().filter(x=>x.n==nm)[0];
 app.innerHTML=`<div class=card style="text-align:center"><img class=logo src=logo.svg alt="" onerror="this.style.display='none'"><div class=kick style="margin-top:14px">Metro Team</div><h1 style="font-size:32px;margin:4px 0">10-Finger Typing Test</h1><p style="color:var(--mu);margin:0">Use all ten fingers and keep your eyes on the screen. The keyboard below shows which finger hits each key.</p>
<div class=rules><div><b>WPM</b>words per minute</div><div><b>%</b>accuracy counts</div><div><b>10</b>fingers, no peeking</div></div>
<p class=kick style="margin:18px 0 8px">Choose your time</p><div class=dur>${[30,60,120].map(s=>`<button class="btn g${S.dur==s?" on":""}" data-d=${s}>${s==120?"2 min":s+" sec"}</button>`).join("")}</div>
<input class=in id=nm maxlength=24 placeholder="Enter your name" value="${esc(nm)}" autocomplete=off>${best?`<p class=note style="margin:-4px 0 12px">Your best on this device: <b style="color:var(--gold2)">${best.w} WPM</b> at ${best.a}% accuracy</p>`:""}
<button class=btn id=go style="width:100%">Start typing test</button><button class="btn g" id=chb style="width:100%;margin-top:10px">⚔ Challenge a colleague</button><p class=note>Best on a laptop or desktop with a physical keyboard.</p></div>`;
 document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{S.dur=+b.dataset.d;home();$("#nm").focus()});
 $("#go").onclick=()=>{const n=$("#nm").value.trim();if(!n){$("#nm").focus();return}try{localStorage.setItem("mt_quiz_name",n)}catch(e){}S.name=n;begin()};
 $("#nm").onkeydown=e=>{if(e.key=="Enter")$("#go").click()};$("#chb").onclick=chHub;chBadge()}
function begin(){clearInterval(timer);Object.assign(S,{text:mk(S.chal?mulberry32(S.chal.seed):null),pos:0,st:[],keys:0,bad:0,t0:0,phase:"ready"});
 app.innerHTML=`<div class=card><div class=hud><span class=chip><b id=w>0</b>WPM</span><span class=chip><b id=a>100</b>% accuracy</span><span class=sp></span><span class=chip><b id=t>${S.dur}</b>sec</span></div>
<div class=tm id=tm><i id=tb></i></div><div id=box class=idle>${[...S.text].map(c=>`<span>${esc(c)}</span>`).join("")}</div>
<div class=hint id=hint></div>${kbHtml()}${S.chal?`<p class=chn style="margin-top:14px">⚔ Challenge vs <b>${esc(S.chal.opp)}</b>. One attempt, and you both type the same text. Start typing when you are ready.</p>`:`<div class=row style="margin-top:16px"><button class="btn g" id=rs>Restart</button><button class="btn g" id=hm>Change name or time</button></div>`}</div>`;
 S.sp=[...document.querySelectorAll("#box span")];paint(0);hint();
 if(!S.chal){$("#rs").onclick=()=>{$("#rs").blur();begin()};$("#hm").onclick=home}}
function paint(i){const s=S.sp[i];if(!s)return;s.className=S.st[i]==1?"ok":S.st[i]==2?"bad":"";if(i==S.pos)s.classList.add("cur");
 const nx=S.sp[S.pos];if(nx){nx.classList.add("cur");const b=$("#box"),lh=nx.offsetHeight;b.scrollTop=Math.max(0,nx.offsetTop-b.offsetTop-lh-16)}}
function hint(){document.querySelectorAll(".key.nx").forEach(k=>k.classList.remove("nx"));const c=S.text[S.pos];if(c==null){$("#hint").textContent="";return}
 const{k,shift}=keyFor(c),kk=k==" "?"sp":k;const el=document.querySelector(`.key[data-k="${CSS.escape(kk)}"]`);if(el)el.classList.add("nx");
 if(shift){const e2=document.querySelector(`.key[data-k="${shift}"]`);if(e2)e2.classList.add("nx")}
 const f=FN[FINGER[k]]||"";$("#hint").innerHTML=`Next: <b>${c==" "?"space":esc(c)}</b> with your <b>${f}</b>${shift?` + <b>${FN[FINGER[shift]]}</b> on shift`:""}`}
function stats(){const el=Math.max(1,S.phase=="done"?S.el:(Date.now()-S.t0)/1000),ok=S.st.filter(x=>x==1).length,w=Math.round(ok/5/(el/60)),a=S.keys?Math.round((S.keys-S.bad)/S.keys*100):100;return{w,a,ok,el}}
function tick(){const el=(Date.now()-S.t0)/1000,rem=Math.max(0,S.dur-el),st=stats();$("#w").textContent=st.w;$("#a").textContent=st.a;$("#t").textContent=Math.ceil(rem);$("#tb").style.width=rem/S.dur*100+"%";$("#tm").classList.toggle("low",rem<6);if(rem<=0)finish()}
function key(e){if(e.ctrlKey||e.metaKey||e.altKey||!S.phase||S.phase=="done"||document.activeElement&&document.activeElement.tagName=="INPUT")return;
 if(e.key=="Backspace"){e.preventDefault();if(S.pos>0){S.pos--;S.st[S.pos]=0;S.sp[S.pos+1]&&(S.sp[S.pos+1].className="");paint(S.pos);hint()}return}
 if(e.key.length!=1)return;e.preventDefault();
 if(S.phase=="ready"){S.phase="run";S.t0=Date.now();$("#box").classList.remove("idle");timer=setInterval(tick,200)}
 const i=S.pos,c=S.text[i];S.keys++;const good=e.key===c;if(good)S.st[i]=1;else{S.st[i]=2;S.bad++}flash(e.key,good);
 S.pos++;S.sp[i].className=S.st[i]==1?"ok":"bad";paint(S.pos);hint();if(S.pos>=S.text.length)finish()}
function flash(k,good){const l=k.toLowerCase(),el=document.querySelector(`.key[data-k="${CSS.escape(l==" "?"sp":l)}"]`);if(!el)return;el.classList.remove("gd","bd");el.classList.add(good?"gd":"bd");setTimeout(()=>el.classList.remove("gd","bd"),160)}
addEventListener("keydown",key);
function finish(){if(S.phase=="done")return;const ch=S.chal;S.chal=null;const used=Math.min(S.dur,(Date.now()-S.t0)/1000);S.phase="done";S.el=used;clearInterval(timer);
 const st=stats(),r=RANKS.find(x=>st.w<x[0]),l=saveLb(S.name,st.w,st.a),me=l.findIndex(x=>x.n==S.name&&x.w==st.w&&x.a==st.a),top=l.slice(0,5);
 try{if(parent!==window)parent.postMessage({type:"mt-typing",wpm:st.w,acc:st.a,secs:Math.round(used)},location.origin)}catch(e){}
 app.innerHTML=`<div class=card><div class=kick style="text-align:center">Time's up</div><div class=big>${st.w}</div><div class=bigl>words per minute</div><div class=rank>${r[1]}</div><div class=sub>${r[2]}</div>
<div class=stats><div><b>${st.a}%</b>accuracy</div><div><b>${S.pos}</b>characters typed</div><div><b>${S.bad}</b>mistakes</div><div><b>${Math.round(used)}s</b>time</div></div>
${parent!==window?`<p class=note style="margin:-6px 0 14px">Your score was sent to the team leaderboard.</p>`:""}${st.a<92?`<p class=note style="margin:-6px 0 16px;color:var(--gold2)">Tip: slow down a little. Clean typing at 92% or better is faster in real work than fixing mistakes.</p>`:""}
${ch?`<div class=chbox id=chres>Saving your challenge result…</div>`:""}<h3 style="font-size:16px">Leaderboard <small style="color:var(--mu);font-weight:500">(this device)</small></h3><table class=lb>${top.map((x,j)=>`<tr class="${j==me?"me":""}"><td>${["🥇","🥈","🥉"][j]||j+1}</td><td>${esc(x.n)}</td><td style="color:var(--mu);font-weight:500">${x.a}%</td><td>${x.w} WPM</td></tr>`).join("")}</table>
<div class=row><button class=btn id=ag>Try again</button>${ch?`<button class="btn g" id=chgo>My challenges</button>`:""}<button class="btn g" id=hm>Change name or time</button></div></div>`;
 $("#ag").onclick=begin;$("#hm").onclick=home;if(ch){$("#chgo").onclick=chHub;chFinish(ch,st.w,st.a)}}
home();
</script></body></html>
