<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1430"><title>Metro Team · 10-Finger Typing Test</title>
<link rel="icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1430;--gold:#d9a826;--gold2:#f3cf63;--ac:#3b72ea;--ok:#22c58b;--bad:#f0616d;--mu:#a9b7d6;--disp:Manrope,Inter,system-ui,sans-serif;--k:clamp(22px,5.4vw,40px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#fff;font:15px/1.5 Inter,system-ui,sans-serif;background:radial-gradient(800px 480px at 90% -10%,rgba(59,114,234,.6),transparent 60%),radial-gradient(600px 400px at 0% 110%,rgba(217,168,38,.25),transparent 60%),linear-gradient(135deg,#14224a,#070d22);background-attachment:fixed}
h1,h2,h3{font-family:var(--disp);margin:0}
.wrap{max-width:860px;margin:auto;padding:22px 16px 40px}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-top:4px solid var(--gold);border-radius:20px;padding:26px;backdrop-filter:blur(8px);box-shadow:0 24px 60px rgba(3,8,24,.45);animation:in .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.logo{width:64px;height:64px;border-radius:16px;box-shadow:0 0 0 3px rgba(217,168,38,.6)}
.kick{color:var(--gold2);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.btn{background:linear-gradient(135deg,#f3cf63,#d9a826 60%,#b9871a);color:#2a1f00;border:0;border-radius:12px;padding:13px 22px;font:800 15px var(--disp);cursor:pointer;box-shadow:0 8px 20px rgba(217,168,38,.3);transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06)}.btn.g{background:rgba(255,255,255,.1);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.25)}
.btn.on{outline:2px solid var(--gold2)}
.in{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:#fff;font:inherit;margin:14px 0}
.in:focus{outline:2px solid var(--gold);outline-offset:1px}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 6px}.rules div{background:rgba(0,0,0,.22);border-radius:12px;padding:12px 10px;text-align:center;font-size:12.5px;color:var(--mu)}.rules b{display:block;font:800 20px var(--disp);color:#fff}
.dur{display:flex;gap:10px;justify-content:center;margin:6px 0 4px}.dur .btn{flex:1;max-width:130px;padding:10px}
.hud{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.1);border-radius:999px;padding:5px 14px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}.chip b{font:800 18px var(--disp);color:var(--gold2);margin-right:4px}
.sp{flex:1}
.tm{height:8px;background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden;margin-bottom:14px}.tm i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--ok),var(--gold2));border-radius:9px}.tm.low i{background:linear-gradient(90deg,var(--bad),#ff9a3c)}
#box{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:16px 18px;font:500 22px/1.75 "Courier New",ui-monospace,monospace;height:calc(1.75em*3 + 32px);overflow:hidden;position:relative;cursor:text;letter-spacing:.02em}
#box.idle:after{content:"Start typing to begin. The clock starts on your first key.";position:absolute;inset:0;display:grid;place-items:center;background:rgba(11,20,48,.72);font:700 15px var(--disp);color:var(--gold2);letter-spacing:0}
#box span{color:rgba(255,255,255,.45)}#box span.ok{color:#fff}#box span.bad{color:#fff;background:rgba(240,97,109,.55);border-radius:3px}#box span.cur{background:rgba(243,207,99,.35);border-radius:3px;color:#fff}
.hint{margin:12px 0 10px;text-align:center;color:var(--mu);font-size:13px;min-height:20px}.hint b{color:var(--gold2)}
.kb{display:flex;flex-direction:column;gap:5px;align-items:center;margin:6px 0 4px;user-select:none}
.kr{display:flex;gap:5px}
.key{width:var(--k);height:var(--k);border-radius:8px;display:grid;place-items:center;font:700 clamp(10px,2.4vw,14px) var(--disp);text-transform:uppercase;color:#fff;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);position:relative;transition:transform .08s,box-shadow .1s}
.key.w{width:calc(var(--k)*1.6)}.key.sp2{width:calc(var(--k)*6.4)}
.key.home:after{content:"";position:absolute;bottom:4px;width:40%;height:2px;border-radius:2px;background:rgba(255,255,255,.7)}
.f-lp{background:rgba(240,97,109,.22)}.f-lr{background:rgba(255,154,60,.22)}.f-lm{background:rgba(243,207,99,.22)}.f-li{background:rgba(34,197,139,.22)}
.f-ri{background:rgba(56,189,248,.22)}.f-rm{background:rgba(59,114,234,.30)}.f-rr{background:rgba(168,85,247,.25)}.f-rp{background:rgba(236,72,153,.25)}.f-th{background:rgba(255,255,255,.12)}
.key.nx{background:linear-gradient(135deg,#f3cf63,#d9a826);color:#2a1f00;border-color:#fff;transform:translateY(-3px) scale(1.08);box-shadow:0 0 18px rgba(243,207,99,.8);z-index:2}
.leg{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;margin:10px 0 0;font-size:11.5px;color:var(--mu)}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid rgba(255,255,255,.3)}
.note{font-size:12px;color:var(--mu);text-align:center;margin-top:12px}
.big{font:800 72px/1 var(--disp);color:var(--gold2);text-align:center;margin:8px 0 0}.bigl{text-align:center;color:var(--mu);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.rank{text-align:center;font:800 24px var(--disp);margin-top:10px}.sub{text-align:center;color:var(--mu);margin:4px 0 18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}.stats div{background:rgba(0,0,0,.22);border-radius:12px;padding:12px;text-align:center;color:var(--mu);font-size:12px}.stats b{display:block;font:800 22px var(--disp);color:#fff}
.lb{width:100%;border-collapse:collapse;margin:8px 0 20px;font-size:14px}.lb td{padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.1)}.lb td:last-child{text-align:right;font-weight:800;color:var(--gold2)}.lb tr.me td{background:rgba(217,168,38,.15)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1}
@media(max-width:560px){.card{padding:20px 14px}#box{font-size:17px}.big{font-size:56px}.stats{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="wrap" id="app"></div>
<script>
const SENT=["Good customer service starts with a warm greeting and a clear voice.","Hello, my name is Grace and I am calling from MTN MoMo. How are you doing today?","We will never ask for your MoMo PIN over the phone, so keep it private.","Buy airtime or a data bundle with your MoMo wallet and earn a bonus on your line.","Visit any MoMo agent today and make a simple cash in to your wallet.","Listen carefully, speak slowly, and always thank the customer for their time.","Typing fast is a skill that grows with practice, so keep your eyes on the screen and let your fingers find the keys.","The quick brown fox jumps over the lazy dog while the team waits for the next call.","Accurate call notes help the next agent understand what the customer needs.","Rest your fingers on the home row and use every finger, including both thumbs on the space bar.","One team, one goal, and every call is a chance to make someone's day better.","Pay your electricity bill, send money to family, and buy discounted airtime without leaving home.","Never look at the keyboard, trust your fingers and build speed one word at a time.","A calm tone and a friendly smile you can hear will win more customers than a fast pitch.","Accuracy comes first, because speed without accuracy only creates more work for you."];
const ROWS=[["q","w","e","r","t","y","u","i","o","p"],["a","s","d","f","g","h","j","k","l",";","'"],["ShiftL","z","x","c","v","b","n","m",",",".","/","ShiftR"],[" "]];
const FINGER={q:"lp",a:"lp",z:"lp",w:"lr",s:"lr",x:"lr",e:"lm",d:"lm",c:"lm",r:"li",f:"li",v:"li",t:"li",g:"li",b:"li",y:"ri",h:"ri",n:"ri",u:"ri",j:"ri",m:"ri",i:"rm",k:"rm",",":"rm",o:"rr",l:"rr",".":"rr",p:"rp",";":"rp","'":"rp","/":"rp"," ":"th",ShiftL:"lp",ShiftR:"rp"};
const FN={lp:"left pinky",lr:"left ring finger",lm:"left middle finger",li:"left index finger",ri:"right index finger",rm:"right middle finger",rr:"right ring finger",rp:"right pinky",th:"thumb"};
const FC={lp:"#f0616d",lr:"#ff9a3c",lm:"#f3cf63",li:"#22c58b",ri:"#38bdf8",rm:"#3b72ea",rr:"#a855f7",rp:"#ec4899",th:"#ffffff"};
const RANKS=[[15,"Beginner Fingers","Everyone starts here. Keep your eyes up and play again."],[30,"Warming Up","Your fingers are finding their places. Keep going."],[45,"Steady Typist","A solid pace. Accuracy first, speed will follow."],[60,"Fast Typist","Quick and clean. Well done."],[80,"Speed Demon","Customers will barely notice you typing."],[999,"Keyboard Legend","Lightning hands. The floor bows to you."]];
const $=s=>document.querySelector(s),app=$("#app");
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let S={dur:60,name:""},timer=null;
const LBK="mt_type_lb";
function lb(){try{return JSON.parse(localStorage.getItem(LBK)||"[]")}catch(e){return[]}}
function saveLb(n,w,a){const l=lb();l.push({n,w,a,d:Date.now()});l.sort((x,y)=>y.w-x.w);const t=l.slice(0,20);try{localStorage.setItem(LBK,JSON.stringify(t))}catch(e){}return t}
function mk(){let o=shuf(SENT),t="";while(t.length<1200){if(!o.length)o=shuf(SENT);t+=(t?" ":"")+o.pop()}return t}
function keyFor(c){let shift=null,k=c;if(c!==c.toLowerCase()&&/[A-Z]/.test(c)){k=c.toLowerCase()}else if(c==="?"){k="/";}else if(c===":"){k=";"}
 if(k!==c){const h=FINGER[k]&&FINGER[k].startsWith("l")?"ShiftR":"ShiftL";shift=h}return{k,shift}}
function kbHtml(){return `<div class=kb>${ROWS.map((r,i)=>`<div class=kr style="${i==1?"margin-left:calc(var(--k)*.45)":i==0?"margin-right:calc(var(--k)*.3)":""}">${r.map(k=>{const lab=k=="ShiftL"||k=="ShiftR"?"shift":k==" "?"space":k;return `<div class="key f-${FINGER[k]}${k==" "?" sp2":/Shift/.test(k)?" w":""}${k=="f"||k=="j"?" home":""}" data-k="${k==" "?"sp":k}">${lab}</div>`}).join("")}</div>`).join("")}</div>
<div class=leg>${Object.keys(FN).map(f=>`<span><i style="background:${FC[f]}66"></i>${FN[f]}</span>`).join("")}</div>`}
function home(){clearInterval(timer);let nm="";try{nm=localStorage.getItem("mt_quiz_name")||""}catch(e){}
 const best=lb().filter(x=>x.n==nm)[0];
 app.innerHTML=`<div class=card style="text-align:center"><img class=logo src=logo.png alt="" onerror="this.style.display='none'"><div class=kick style="margin-top:14px">Metro Team</div><h1 style="font-size:32px;margin:4px 0">10-Finger Typing Test</h1><p style="color:var(--mu);margin:0">Use all ten fingers and keep your eyes on the screen. The keyboard below shows which finger hits each key.</p>
<div class=rules><div><b>WPM</b>words per minute</div><div><b>%</b>accuracy counts</div><div><b>10</b>fingers, no peeking</div></div>
<p class=kick style="margin:18px 0 8px">Choose your time</p><div class=dur>${[30,60,120].map(s=>`<button class="btn g${S.dur==s?" on":""}" data-d=${s}>${s==120?"2 min":s+" sec"}</button>`).join("")}</div>
<input class=in id=nm maxlength=24 placeholder="Enter your name" value="${esc(nm)}" autocomplete=off>${best?`<p class=note style="margin:-4px 0 12px">Your best on this device: <b style="color:var(--gold2)">${best.w} WPM</b> at ${best.a}% accuracy</p>`:""}
<button class=btn id=go style="width:100%">Start typing test</button><p class=note>Best on a laptop or desktop with a physical keyboard.</p></div>`;
 document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{S.dur=+b.dataset.d;home();$("#nm").focus()});
 $("#go").onclick=()=>{const n=$("#nm").value.trim();if(!n){$("#nm").focus();return}try{localStorage.setItem("mt_quiz_name",n)}catch(e){}S.name=n;begin()};
 $("#nm").onkeydown=e=>{if(e.key=="Enter")$("#go").click()}}
function begin(){clearInterval(timer);Object.assign(S,{text:mk(),pos:0,st:[],keys:0,bad:0,t0:0,phase:"ready"});
 app.innerHTML=`<div class=card><div class=hud><span class=chip><b id=w>0</b>WPM</span><span class=chip><b id=a>100</b>% accuracy</span><span class=sp></span><span class=chip><b id=t>${S.dur}</b>sec</span></div>
<div class=tm id=tm><i id=tb></i></div><div id=box class=idle>${[...S.text].map(c=>`<span>${esc(c)}</span>`).join("")}</div>
<div class=hint id=hint></div>${kbHtml()}<div class=row style="margin-top:16px"><button class="btn g" id=rs>Restart</button><button class="btn g" id=hm>Change name or time</button></div></div>`;
 S.sp=[...document.querySelectorAll("#box span")];paint(0);hint();
 $("#rs").onclick=()=>{$("#rs").blur();begin()};$("#hm").onclick=home}
function paint(i){const s=S.sp[i];if(!s)return;s.className=S.st[i]==1?"ok":S.st[i]==2?"bad":"";if(i==S.pos)s.classList.add("cur");
 const nx=S.sp[S.pos];if(nx){nx.classList.add("cur");const b=$("#box"),lh=nx.offsetHeight;b.scrollTop=Math.max(0,nx.offsetTop-b.offsetTop-lh-16)}}
function hint(){document.querySelectorAll(".key.nx").forEach(k=>k.classList.remove("nx"));const c=S.text[S.pos];if(c==null){$("#hint").textContent="";return}
 const{k,shift}=keyFor(c),kk=k==" "?"sp":k;const el=document.querySelector(`.key[data-k="${CSS.escape(kk)}"]`);if(el)el.classList.add("nx");
 if(shift){const e2=document.querySelector(`.key[data-k="${shift}"]`);if(e2)e2.classList.add("nx")}
 const f=FN[FINGER[k]]||"";$("#hint").innerHTML=`Next: <b>${c==" "?"space":esc(c)}</b> with your <b>${f}</b>${shift?` + <b>${FN[FINGER[shift]]}</b> on shift`:""}`}
function stats(){const el=Math.max(1,S.phase=="done"?S.el:(Date.now()-S.t0)/1000),ok=S.st.filter(x=>x==1).length,w=Math.round(ok/5/(el/60)),a=S.keys?Math.round((S.keys-S.bad)/S.keys*100):100;return{w,a,ok,el}}
function tick(){const el=(Date.now()-S.t0)/1000,rem=Math.max(0,S.dur-el),st=stats();$("#w").textContent=st.w;$("#a").textContent=st.a;$("#t").textContent=Math.ceil(rem);$("#tb").style.width=rem/S.dur*100+"%";$("#tm").classList.toggle("low",rem<6);if(rem<=0)finish()}
function key(e){if(e.ctrlKey||e.metaKey||e.altKey||!S.phase||S.phase=="done"||document.activeElement&&document.activeElement.tagName=="INPUT")return;
 if(e.key=="Backspace"){e.preventDefault();if(S.pos>0){S.pos--;S.st[S.pos]=0;S.sp[S.pos+1]&&(S.sp[S.pos+1].className="");paint(S.pos);hint()}return}
 if(e.key.length!=1)return;e.preventDefault();
 if(S.phase=="ready"){S.phase="run";S.t0=Date.now();$("#box").classList.remove("idle");timer=setInterval(tick,200)}
 const i=S.pos,c=S.text[i];S.keys++;if(e.key===c)S.st[i]=1;else{S.st[i]=2;S.bad++}
 S.pos++;S.sp[i].className=S.st[i]==1?"ok":"bad";paint(S.pos);hint();if(S.pos>=S.text.length)finish()}
addEventListener("keydown",key);
function finish(){if(S.phase=="done")return;const used=Math.min(S.dur,(Date.now()-S.t0)/1000);S.phase="done";S.el=used;clearInterval(timer);
 const st=stats(),r=RANKS.find(x=>st.w<x[0]),l=saveLb(S.name,st.w,st.a),me=l.findIndex(x=>x.n==S.name&&x.w==st.w&&x.a==st.a),top=l.slice(0,5);
 try{if(parent!==window)parent.postMessage({type:"mt-typing",wpm:st.w,acc:st.a,secs:Math.round(used)},location.origin)}catch(e){}
 app.innerHTML=`<div class=card><div class=kick style="text-align:center">Time's up</div><div class=big>${st.w}</div><div class=bigl>words per minute</div><div class=rank>${r[1]}</div><div class=sub>${r[2]}</div>
<div class=stats><div><b>${st.a}%</b>accuracy</div><div><b>${S.pos}</b>characters typed</div><div><b>${S.bad}</b>mistakes</div><div><b>${Math.round(used)}s</b>time</div></div>
${st.a<92?`<p class=note style="margin:-6px 0 16px;color:var(--gold2)">Tip: slow down a little. Clean typing at 92% or better is faster in real work than fixing mistakes.</p>`:""}
<h3 style="font-size:16px">Leaderboard <small style="color:var(--mu);font-weight:500">(this device)</small></h3><table class=lb>${top.map((x,j)=>`<tr class="${j==me?"me":""}"><td>${["🥇","🥈","🥉"][j]||j+1}</td><td>${esc(x.n)}</td><td style="color:var(--mu);font-weight:500">${x.a}%</td><td>${x.w} WPM</td></tr>`).join("")}</table>
<div class=row><button class=btn id=ag>Try again</button><button class="btn g" id=hm>Change name or time</button></div></div>`;
 $("#ag").onclick=begin;$("#hm").onclick=home}
home();
</script></body></html>
