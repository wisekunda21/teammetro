<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1430"><title>Metro Team · Customer Scenarios</title>
<link rel="icon" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1430;--navy2:#16275a;--gold:#d9a826;--gold2:#f3cf63;--ac:#3b72ea;--ok:#22c58b;--bad:#f0616d;--mu:#a9b7d6;--disp:Manrope,Inter,system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#fff;font:15px/1.5 Inter,system-ui,sans-serif;background:radial-gradient(900px 500px at 85% -15%,rgba(59,114,234,.55),transparent 55%),radial-gradient(700px 420px at -5% 110%,rgba(217,168,38,.22),transparent 55%),linear-gradient(145deg,#14224a,#070d22);background-attachment:fixed}
h1,h2,h3{font-family:var(--disp);margin:0}
.wrap{max-width:640px;margin:auto;padding:22px 16px 48px}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-top:4px solid var(--gold);border-radius:22px;padding:28px 24px;backdrop-filter:blur(10px);box-shadow:0 28px 70px rgba(3,8,24,.5);animation:in .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.logo{width:64px;height:64px;border-radius:16px;box-shadow:0 0 0 3px rgba(217,168,38,.55)}
.kick{color:var(--gold2);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.btn{background:linear-gradient(135deg,#f3cf63,#d9a826 55%,#b9871a);color:#2a1f00;border:0;border-radius:12px;padding:13px 22px;font:800 15px var(--disp);cursor:pointer;box-shadow:0 8px 22px rgba(217,168,38,.32);transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.07)}.btn.g{background:rgba(255,255,255,.1);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.22)}
.in{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.28);color:#fff;font:inherit;margin:14px 0}
.in:focus{outline:2px solid var(--gold);outline-offset:1px}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 8px}.rules div{background:rgba(0,0,0,.25);border-radius:14px;padding:12px 10px;text-align:center;font-size:12.5px;color:var(--mu)}.rules b{display:block;font:800 20px var(--disp);color:#fff}
.hud{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-weight:700}
.hud .sc{font:800 22px var(--disp);color:var(--gold2)}.hud .sp{flex:1}
.chip{background:rgba(255,255,255,.1);border-radius:999px;padding:4px 12px;font-size:13px}
.say{background:rgba(0,0,0,.3);border-left:4px solid var(--gold);border-radius:0 14px 14px 0;padding:16px 18px;margin:10px 0 16px;font:600 17px/1.4 var(--disp)}
.opt{display:block;width:100%;text-align:left;margin-top:10px;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;font:inherit;cursor:pointer;transition:transform .12s,background .15s,border-color .15s}
.opt:hover:not(:disabled){background:rgba(255,255,255,.12);border-color:var(--gold);transform:translateX(4px)}
.opt:disabled{cursor:default}.opt.ok{background:rgba(34,197,139,.22);border-color:var(--ok)}.opt.bad{background:rgba(240,97,109,.2);border-color:var(--bad)}
.fb{margin-top:16px;padding:14px 16px;border-radius:14px;background:rgba(0,0,0,.28);border-left:4px solid var(--gold)}.fb.ok{border-color:var(--ok)}.fb.bad{border-color:var(--bad)}.fb b{font-family:var(--disp)}.fb p{margin:4px 0 12px;color:#dbe4f7}
.big{font:800 56px/1 var(--disp);color:var(--gold2);text-align:center;margin:8px 0}
.rank{text-align:center;font:800 22px var(--disp)}.sub{text-align:center;color:var(--mu);margin:4px 0 18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.stats div{background:rgba(0,0,0,.22);border-radius:12px;padding:12px;text-align:center;color:var(--mu);font-size:12px}.stats b{display:block;font:800 22px var(--disp);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1}
@media(max-width:520px){.card{padding:22px 16px}.say{font-size:15px}.big{font-size:48px}}
</style><style>

/* Metro Team Game Arena — refreshed visual system */
:root{--mu:#aebbd8;--gold:#e7b93f;--gold2:#ffe18a;--ac:#79a4ff;--ok:#39d9a0;--bad:#ff7783}
body{background:radial-gradient(900px 540px at 95% -8%,rgba(64,112,225,.24),transparent 62%),radial-gradient(720px 460px at -8% 105%,rgba(215,164,43,.14),transparent 62%),linear-gradient(145deg,#0d1731 0%,#080e20 62%,#080b17 100%);background-attachment:fixed}
.wrap{max-width:1040px;width:100%;margin:0 auto;padding:clamp(16px,3vw,36px) 20px 48px}
.card{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(145deg,rgba(24,39,72,.96),rgba(10,18,39,.97));border:1px solid rgba(172,192,230,.18);border-top:0;border-radius:26px;padding:clamp(22px,3vw,40px);box-shadow:0 28px 80px rgba(0,0,0,.36),inset 0 1px rgba(255,255,255,.06);backdrop-filter:blur(16px)}
.card::before{content:"";position:absolute;z-index:-1;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#78a2ff 0%,#e7b93f 48%,#ffd976 60%,#78a2ff 100%);opacity:.95}
.logo{width:66px;height:66px;object-fit:cover;border-radius:19px;box-shadow:0 0 0 1px rgba(255,225,138,.42),0 10px 26px rgba(0,0,0,.25)}
h1,h2,h3{letter-spacing:-.035em}
h1{font-size:clamp(28px,3vw,38px)!important;line-height:1.16!important;margin:10px 0 8px!important}
.kick{display:inline-flex;align-items:center;gap:8px;padding:6px 11px;border-radius:999px;border:1px solid rgba(255,225,138,.2);background:rgba(231,185,63,.08);color:var(--gold2);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.kick::before{content:"";width:6px;height:6px;display:inline-block;border-radius:50%;background:var(--gold2);box-shadow:0 0 12px rgba(255,225,138,.8)}
.card p{line-height:1.65}
.rules{gap:12px;margin:22px 0 12px}
.rules div,.stats div{background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));border:1px solid rgba(173,192,226,.12);border-radius:17px;padding:15px 13px;box-shadow:inset 0 1px rgba(255,255,255,.035)}
.rules b,.stats b{font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.btn{border-radius:14px;padding:13px 22px;font-weight:800;letter-spacing:-.01em;box-shadow:0 9px 26px rgba(215,164,43,.19);transition:transform .18s ease,filter .18s ease,box-shadow .18s ease}
.btn:hover{transform:translateY(-2px);filter:brightness(1.07);box-shadow:0 13px 28px rgba(215,164,43,.23)}
.btn:active{transform:translateY(0)}
.btn.g{background:rgba(255,255,255,.045);border:1px solid rgba(174,193,230,.2);color:#e9efff;box-shadow:none}
.btn.g:hover{background:rgba(255,255,255,.09);border-color:rgba(255,225,138,.4);box-shadow:none}
.btn.on{outline:2px solid var(--gold2);outline-offset:2px}
.in{border-radius:14px;background:rgba(4,10,24,.55);border:1px solid rgba(174,193,230,.22);padding:14px 16px;transition:border-color .18s,box-shadow .18s}
.in::placeholder{color:#7f8eae}
.in:focus{outline:0;border-color:var(--gold2);box-shadow:0 0 0 4px rgba(255,225,138,.11)}
.hud{gap:10px;padding:12px 14px;border:1px solid rgba(173,192,226,.13);border-radius:17px;background:rgba(3,9,24,.32)}
.chip{border:1px solid rgba(173,192,226,.13);background:rgba(255,255,255,.075);padding:7px 13px;font-variant-numeric:tabular-nums}
.opt{border-radius:15px;padding:15px 17px;border-color:rgba(173,192,226,.17);background:rgba(255,255,255,.045);line-height:1.5}
.opt:hover:not(:disabled){background:rgba(255,255,255,.085);border-color:rgba(255,225,138,.65);transform:translateY(-1px)}
.opt b{border:1px solid rgba(173,192,226,.16);background:rgba(255,255,255,.08);width:30px;height:30px;border-radius:10px}
.opt.ok{background:rgba(57,217,160,.12);border-color:rgba(57,217,160,.68)}.opt.bad{background:rgba(255,119,131,.12);border-color:rgba(255,119,131,.62)}
.step{border-radius:16px;border-color:rgba(173,192,226,.16);background:rgba(255,255,255,.045);padding:16px 18px;line-height:1.5}
.step:hover{border-color:rgba(255,225,138,.42);background:rgba(255,255,255,.075)}
.step .num{border:1px solid rgba(255,225,138,.15);background:rgba(231,185,63,.1)}
.fb{border-radius:16px;background:rgba(3,9,24,.38);border:1px solid rgba(173,192,226,.1);border-left:4px solid var(--gold)}
.big{letter-spacing:-.06em;text-shadow:0 8px 30px rgba(255,225,138,.12)}
.stats{gap:12px}.stats div{padding:15px 12px}
.streak{box-shadow:0 8px 20px rgba(240,97,109,.16)}
#box{border-radius:17px;background:rgba(3,9,24,.42);border-color:rgba(173,192,226,.16);box-shadow:inset 0 1px rgba(255,255,255,.025)}
.key{border-radius:9px;box-shadow:0 3px 0 rgba(0,0,0,.18);border-color:rgba(173,192,226,.16)}
.key.nx{box-shadow:0 0 22px rgba(255,225,138,.35),0 3px 0 rgba(0,0,0,.15)}
.tm{background:rgba(255,255,255,.09);height:9px}.tm i{box-shadow:0 0 14px rgba(57,217,160,.18)}
.lb td{border-bottom-color:rgba(173,192,226,.12)}
.note{line-height:1.6}
@media(max-width:700px){.wrap{padding:14px 12px 28px}.card{border-radius:21px;padding:23px 17px}.rules{gap:8px}.rules div{padding:12px 8px}.hud{gap:7px;padding:9px}.chip{padding:6px 10px;font-size:12px}.row .btn{min-width:140px}.step{padding:13px 12px;gap:10px}}
@media(max-width:420px){.rules{grid-template-columns:repeat(2,minmax(0,1fr))}.rules div:last-child:nth-child(odd){grid-column:1/-1}.dur{gap:6px}.dur .btn{padding:10px 8px}.stats{gap:8px}}
@media(prefers-reduced-motion:reduce){.card,.btn,.opt,.step{animation:none!important;transition:none!important}}

</style></head><body>
<div class="wrap" id="app"></div>
<script>
const Q=[
{s:"PIN safety",q:"“Someone on WhatsApp said I won a MoMo prize and asked for my PIN.”",o:["Tell them to reply and ask for proof of the prize","Advise: MTN MoMo only contacts customers about prizes through 115. Never share the PIN","Ask them to send the PIN so you can check the prize","Tell them to share only the last 4 digits"],a:1,e:"MTN MoMo only contacts customers through 115. Never share PIN or personal details with anyone claiming a prize."},
{s:"PIN safety",q:"“Can I just read you my PIN so you can reset it faster?”",o:["Take the PIN and complete the reset for them","Stop them and say we never ask for the MoMo PIN – keep it private","Ask for the first two digits only","Write it down for verification"],a:1,e:"We never ask for a MoMo PIN over the phone. Remind the customer to keep it private."},
{s:"Objection",q:"“I’m not interested.”",o:["Hang up immediately","Thank them, confirm the outcome and dispose the call correctly","Argue the benefits again until they change their mind","Skip the notes to save time"],a:1,e:"Close every call properly and log accurate notes, even on a no."},
{s:"Objection",q:"“Is this a scam? Why are you calling me?”",o:["Get defensive and insist you are genuine","Give a calm, clear reason for the call, confirm your name and that you are from MTN MoMo, and never ask for the PIN","Ask them to prove their identity first","Hang up because they are difficult"],a:1,e:"Stay calm, state the reason simply, introduce yourself properly and reinforce PIN safety."},
{s:"Inactive",q:"“I lost my SIM and never used MoMo again.”",o:["Tell them to buy a new SIM and forget the old wallet","Advise Change of Ownership or SIM replacement at an MTN shop, capture the feedback and end the call properly","Ask for the old PIN so you can transfer the balance","Pitch the highest value offer anyway"],a:1,e:"Wrong party / lost SIM: advise Change of Ownership at an MTN shop, capture feedback and end the call."},
{s:"Inactive",q:"“I forgot my PIN and gave up.”",o:["Pitch Offer 1 (1ZED minutes) first","Pitch the PIN Reset Cashback (K5) first – it is the primary offer","Tell them PIN reset is impossible","Ask them to create a new wallet"],a:1,e:"Always pitch PIN Reset Cashback first for customers who forgot their PIN."},
{s:"KYC",q:"“My PIN reset keeps failing.”",o:["Tell them to try again tomorrow","Advise them to visit the nearest MTN Service Centre with NRC or Passport; updates take up to 72 hours","Ask them to send the NRC by SMS","Tell them to buy a new SIM"],a:1,e:"KYC issues are fixed at an MTN Service Centre with valid ID, within 72 hours."},
{s:"Cash-in",q:"“So the cashback is only for the first deposit?”",o:["Yes, only the first deposit qualifies","No – they earn cashback on every qualifying cash-in, up to K10 per deposit","Only one deposit per week qualifies","Yes, but they can reapply next month"],a:1,e:"It is not a once-off reward. Every qualifying cash-in earns cashback."},
{s:"Time",q:"“This is a bad time.”",o:["Pitch quickly anyway before they hang up","Offer to call back at a better time and dispose correctly","Hang up without saying anything","Ask them to call you later"],a:1,e:"Respect the answer. Offer a callback and dispose the call."},
{s:"Self recharge",q:"“Do I have to visit an agent to get the K5 or K10 bonus?”",o:["Yes, the bonus is only paid at an agent","No – they dial *115# and pay with the MoMo wallet; no agent visit needed","Only on weekends","They must buy at an MTN shop"],a:1,e:"K5 and K10 segment customers recharge themselves on *115#. Agent visit is for the Cash-In welcome offer."}
];
const N=8,RANKS=[[40,"Needs more practice","Scenarios get easier with repetition."],[65,"Solid handler","You are reading customers well."],[85,"Scenario Pro","Calm, correct answers under pressure."],[101,"Customer Champion","Almost perfect. The floor trusts you."]];
const $=s=>document.querySelector(s),app=$("#app");
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let S={};
function home(){
  let nm="";try{nm=localStorage.getItem("mt_quiz_name")||""}catch(e){}
  app.innerHTML=`<div class=card style="text-align:center"><img class=logo src=logo.svg alt="" onerror="this.style.display='none'"><div class=kick style="margin-top:14px">Metro Team</div>
  <h1 style="font-size:28px;margin:6px 0 4px">Customer Scenarios</h1>
  <p style="color:var(--mu);margin:0">A customer says something. Choose the best reply. Short explanations after every answer.</p>
  <div class=rules><div><b>${N}</b>scenarios</div><div><b>PIN</b>safety</div><div><b>Objections</b></div></div>
  <input class=in id=nm maxlength=24 placeholder="Enter your name" value="${esc(nm)}" autocomplete=off>
  <button class=btn id=go style="width:100%">Start scenarios</button></div>`;
  $("#go").onclick=()=>{const n=$("#nm").value.trim();if(!n){$("#nm").focus();return}try{localStorage.setItem("mt_quiz_name",n)}catch(e){}start(n)};
  $("#nm").onkeydown=e=>{if(e.key=="Enter")$("#go").click()}
}
function start(n){S={n,qs:shuf(Q).slice(0,N),i:0,ok:0};ask()}
function ask(){
  const q=S.qs[S.i];q.opts=shuf(q.o.map((t,k)=>({t,c:k===q.a})));
  app.innerHTML=`<div class=card>
  <div class=hud><span class=sc>${S.ok}/${S.i}</span><span class=sp></span><span class=chip>${S.i+1} / ${N}</span></div>
  <div class=kick>${q.s}</div>
  <div class=say>“${esc(q.q)}”</div>
  <div id=os>${q.opts.map((o,k)=>`<button class=opt data-k=${k}>${esc(o.t)}</button>`).join("")}</div>
  <div id=fb></div></div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
}
function pick(k){
  const q=S.qs[S.i],right=q.opts[k].c;
  document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(q.opts[j].c)b.classList.add("ok");else if(j===k)b.classList.add("bad")});
  if(right)S.ok++;
  const last=S.i===N-1;
  $("#fb").innerHTML=`<div class="fb ${right?"ok":"bad"}"><b>${right?"Correct":"Not the best reply"}</b><p>${q.e}</p>
  <button class=btn id=nx>${last?"See results":"Next scenario"}</button></div>`;
  $("#nx").onclick=()=>{S.i++;last?end():ask()};$("#nx").focus();
}
function end(){
  const pct=Math.round(S.ok/N*100),r=RANKS.find(x=>pct<x[0]);
  app.innerHTML=`<div class=card><div class=kick style="text-align:center">Scenarios complete</div>
  <div class=big>${pct}%</div><div class=rank>${r[1]}</div><div class=sub>${r[2]}</div>
  <div class=stats><div><b>${S.ok}/${N}</b>correct</div><div><b>${pct}%</b>accuracy</div><div><b>${N-S.ok}</b>to review</div></div>
  <div class=row><button class=btn id=ag>Play again</button><button class="btn g" id=hm>Change name</button></div></div>`;
  $("#ag").onclick=()=>start(S.n);$("#hm").onclick=home;
  try{if(parent!==window)parent.postMessage({type:"mt-scenarios",score:pct,ok:S.ok,n:N,name:S.n},location.origin)}catch(e){}
}
home();
</script></body></html>
