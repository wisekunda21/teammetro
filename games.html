/* November presentation: follow the workspace theme without changing its settings. */
(function(){
  var root=document.documentElement,host=null,media=window.matchMedia('(prefers-color-scheme: dark)'),observer;
  try{if(window.parent!==window)host=window.parent.document.documentElement}catch(e){}
  function sync(){
    var saved='';
    if(host){saved=host.dataset.theme==='dark'?'dark':'light'}
    else{try{saved=localStorage.getItem('mtheme')||''}catch(e){}if(saved!=='dark'&&saved!=='light')saved=media.matches?'dark':'light'}
    root.dataset.theme=saved;
  }
  function observe(){if(host){if(!observer)observer=new MutationObserver(sync);observer.observe(host,{attributes:true,attributeFilter:['data-theme']})}sync()}
  observe();
  if(media.addEventListener)media.addEventListener('change',sync);else if(media.addListener)media.addListener(sync);
  window.addEventListener('storage',function(e){if(e.key==='mtheme')sync()});
  window.addEventListener('pagehide',function(){if(observer)observer.disconnect()});
  window.addEventListener('pageshow',observe);
})();

const ST=[["Airport (KKIA)","Lusaka",[8,21],[8,21],[8,21]],["Chinsali","Chinsali",[8,17],[9,14],null],["Nakonde","Nakonde",[8,17],[8,13],null],["Barotse Mall","Mongu",[8,18],[9,16],[9,14]],["Town Centre","Mansa",[8,17],[9,13],null],["Chingola","Chingola",[8,17],[9,13],null],["Kafubu Mall","Ndola",[8,17],[9,15],[10,14]],["Kapiji Mall","Solwezi",[8,17],[9,15],[9,13]],["Mukuba Mall","Kitwe",[8,18],[9,15],[9,14]],["Town Centre","Kitwe",[8,17],[9,13],null],["Town Centre","Kasama",[8,17],[9,13],null],["Town Centre","Kabwe",[8,17],[9,14],null],["Crossroads Mall","Lusaka",[8,19],[9,16],[9,15]],["Mandahill Mall","Lusaka",[9,20],[9,16],[9,15]],["Town Centre","Choma",[8,17],[8,13],null],["Makeni Mall","Lusaka",[9,18],[9,16],[10,15]],["Cairo Mall","Lusaka",[8,17],[9,16],[9,14]],["Yello House (HQ)","Lusaka",[9,18],[9,14],null],["Centro Mall, Kabulonga","Lusaka",[9,20],[9,16],[10,15]],["Town Centre","Livingstone",[8,17],[8,14],null],["Chipata Mall","Chipata",[8,17],[9,14],null],["East Park Mall","Lusaka",[8,18],[9,17],[10,15]],["Levy Mall","Lusaka",[9,18],[9,16],[9,15]]];
